    if(s.P&&s.P!=='\u2014')parts.push('potenza '+s.P);
    deckSpeech.push(saySan('Passaggio '+(idx+1)+'. '+s.x+(parts.length?'. Imposta '+parts.join(', ')+'.':'')));
  });
  deckSpeech.push('Buon appetito.');
  deckTotal=slides.length;
  deckTrack.innerHTML=slides.join('');
  if(S.lang==='es') applyLang();
  const hft=document.getElementById('hfToggle');
  if(hft)hft.onclick=()=>{ handsFree=!handsFree; hft.setAttribute('aria-pressed',handsFree?'true':'false'); save('mambo:manilibere',handsFree); };
  const vsel=document.getElementById('voiceSel');
  if(vsel)vsel.onchange=()=>{ voiceURI=vsel.value; save('mambo:voce',voiceURI); pickVoice(); speak('Ciao, questa è la voce che leggerà i passaggi.'); };
  deckDots.innerHTML=slides.map((_,i)=>`<i data-goto="${i}"></i>`).join('');
  deckDots.querySelectorAll('[data-goto]').forEach(d=>d.onclick=()=>gotoSlide(+d.dataset.goto));
  if(deckN>=deckTotal)deckN=deckTotal-1;
  applyDeck();
}
function applyDeck(){
  deckTrack.style.transform=`translateX(${-deckN*100}%)`;
  deckDots.querySelectorAll('i').forEach((d,i)=>d.classList.toggle('on',i===deckN));
  document.getElementById('deckPrev').disabled=deckN<=0;
  document.getElementById('deckNext').disabled=deckN>=deckTotal-1;
  document.getElementById('progline').style.width=((deckN+1)/deckTotal*100)+'%';
  if(voiceOn) speak(deckSpeech[deckN]);
  const cur=deckTrack.children[deckN];
  if(cur){cur.scrollTop=0;const inner=cur.querySelector('.inner');if(inner){inner.style.animation='none';void inner.offsetWidth;inner.style.animation='';}}
}
function gotoSlide(n){ deckN=Math.max(0,Math.min(deckTotal-1,n)); applyDeck(); }
function openDeck(id){ deckId=id; deckN=0; deck.classList.add('open'); document.body.style.overflow='hidden'; buildDeck(); applyFS(); reqWake(); }
function closeDeck(){ deck.classList.remove('open'); document.body.style.overflow=''; clearTimers(); relWake(); stopSpeak();
  voiceOn=false; const vb=document.getElementById('deckVoice'); if(vb){ vb.setAttribute('aria-pressed','false'); const l=vb.querySelector('span'); if(l)l.textContent=L('Leggi','Leer'); } }

/* ---- modalità cottura: timer, avviso, schermo acceso ---- */
function fmtClock(s){const m=Math.floor(s/60),ss=Math.round(s%60);return m+':'+String(ss).padStart(2,'0');}
let wakeLock=null;
async function reqWake(){ try{ if('wakeLock' in navigator){ wakeLock=await navigator.wakeLock.request('screen'); } }catch(e){} }
function relWake(){ try{ wakeLock&&wakeLock.release(); }catch(e){} wakeLock=null; }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&deck.classList.contains('open'))reqWake(); });
let activeTimers=[];
function clearTimers(){ activeTimers.forEach(id=>clearInterval(id)); activeTimers=[]; }
let _actx=null;
function audioCtx(){ try{ const A=window.AudioContext||window.webkitAudioContext; if(!A)return null;
  if(!_actx)_actx=new A(); if(_actx.state==='suspended')_actx.resume(); return _actx; }catch(e){ return null; } }
function beep(){ const a=audioCtx(); if(!a)return; try{
  const now=a.currentTime;
  for(let i=0;i<3;i++){ const t=now+i*0.45; const o=a.createOscillator(),g=a.createGain();
    o.connect(g); g.connect(a.destination); o.type='square';
    o.frequency.setValueAtTime(880,t); o.frequency.setValueAtTime(1175,t+0.11);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.5,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.34); o.start(t); o.stop(t+0.36); }
 }catch(e){} }
function buzz(){ try{ navigator.vibrate&&navigator.vibrate([250,120,250,120,250]); }catch(e){} }
const timerState=new WeakMap();
document.addEventListener('click',e=>{
  const btn=e.target.closest('.tbtn'); if(!btn)return;
  audioCtx(); /* sblocca l'audio ora che c'e' un tocco, cosi il beep suonera' a fine timer */
  const box=btn.closest('.timer'), disp=box.querySelector('.tdisp');
  let st=timerState.get(box); if(!st){ st={rem:+box.dataset.sec, id:null}; timerState.set(box,st); }
  if(st.id){ clearInterval(st.id); st.id=null; box.classList.remove('run'); btn.lastChild.textContent='Riprendi'; return; }
  if(st.rem<=0){ st.rem=+box.dataset.sec; box.classList.remove('done'); }
  box.classList.add('run'); btn.lastChild.textContent='Pausa';
  st.id=setInterval(()=>{
    st.rem--; disp.textContent=fmtClock(st.rem);
    if(st.rem<=0){ clearInterval(st.id); st.id=null; box.classList.remove('run'); box.classList.add('done');
      btn.lastChild.textContent='Ripeti'; disp.textContent='Fatto!'; beep(); buzz();
      if(handsFree && deck.classList.contains('open')){ setTimeout(()=>{ if(deck.classList.contains('open') && deckN<deckTotal-1) gotoSlide(deckN+1); }, 2200); } }
  },1000);
  activeTimers.push(st.id);
});
document.getElementById('deckClose').onclick=closeDeck;
document.getElementById('deckPrev').onclick=()=>gotoSlide(deckN-1);
document.getElementById('deckNext').onclick=()=>gotoSlide(deckN+1);
document.getElementById('deckPdf').onclick=()=>window.print();
const deckSizeBtn=document.getElementById('deckSize');   /* TESTO GRANDE (rimovibile) */
if(deckSizeBtn)deckSizeBtn.onclick=()=>{ fsIdx=(fsIdx+1)%FS_LEVELS.length; save('mambo:testosize',fsIdx); applyFS(); };
const deckVoiceBtn=document.getElementById('deckVoice');
deckVoiceBtn.onclick=()=>{ voiceOn=!voiceOn; deckVoiceBtn.setAttribute('aria-pressed',voiceOn?'true':'false');
  const lab=deckVoiceBtn.querySelector('span'); if(lab)lab.textContent=voiceOn?L('Fermo','Detener'):L('Leggi','Leer');
  if(voiceOn){ pickVoice(); speak(deckSpeech[deckN]); } else stopSpeak(); };
document.addEventListener('keydown',e=>{ if(!deck.classList.contains('open'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){gotoSlide(deckN+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){gotoSlide(deckN-1);}
  else if(e.key==='Escape'){closeDeck();} });
/* swipe */
let tx0=null,ty0=null,swiping=false;
deckTrack.addEventListener('touchstart',e=>{const t=e.touches[0];tx0=t.clientX;ty0=t.clientY;swiping=false;},{passive:true});
deckTrack.addEventListener('touchmove',e=>{if(tx0===null)return;const t=e.touches[0];
  if(Math.abs(t.clientX-tx0)>Math.abs(t.clientY-ty0)+6)swiping=true;},{passive:true});
deckTrack.addEventListener('touchend',e=>{if(tx0===null)return;const dx=e.changedTouches[0].clientX-tx0;
  if(swiping&&Math.abs(dx)>52){ gotoSlide(deckN+(dx<0?1:-1)); } tx0=ty0=null;},{passive:true});

/* ---------- BACKUP DATI (tutto sul dispositivo, non tocca il server) ---------- */
function collectData(){
  return { app:'mamboconvert', v:1, date:new Date().toISOString(), data:{
    pref:S.pref, note:S.note, foto:S.foto, stepfoto:S.stepfoto, accfoto:S.accfoto,
    frigo:S.frigo, spesa:S.spesa, porz:S.porz, tema:S.tema, cols:S.cols, mie:S.mie } };
}
function exportData(){
  try{
    const blob=new Blob([JSON.stringify(collectData(),null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    const d=new Date(), p=n=>String(n).padStart(2,'0');
    a.href=url; a.download=`mamboconvert-backup-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500);
  }catch(e){ alert('Non riesco a creare il file di backup su questo dispositivo.'); }
}
async function importData(file){
  let obj; try{ obj=JSON.parse(await file.text()); }catch(e){ alert('File non valido.'); return; }
  const d=obj&&obj.data;
  if(!obj||obj.app!=='mamboconvert'||!d){ alert('Questo non sembra un backup di Mamboconvert.'); return; }
  const nFav=(d.pref||[]).length, nNote=Object.keys(d.note||{}).length, nFoto=Object.keys(d.foto||{}).length;
  if(!confirm(`Importo il backup del ${obj.date?obj.date.slice(0,10):'?'}?\n\n${nFav} preferiti \u00b7 ${nNote} note \u00b7 ${nFoto} foto\n\nI dati vengono uniti a quelli gi\u00e0 presenti su questo telefono.`)) return;
  if(Array.isArray(d.pref)){ S.pref=[...new Set([...S.pref,...d.pref])]; save('mambo:pref',S.pref); }
  if(Array.isArray(d.frigo)){ S.frigo=[...new Set([...S.frigo,...d.frigo])]; save('mambo:frigo',S.frigo); }
  if(Array.isArray(d.spesa)){ const ids=new Set(S.spesa.map(e=>e.id)); d.spesa.forEach(e=>{ if(e&&!ids.has(e.id)){S.spesa.push(e);ids.add(e.id);} }); save('mambo:spesa',S.spesa); }
  if(d.note){ Object.assign(S.note,d.note); const ix=Object.keys(S.note).filter(k=>S.note[k]&&String(S.note[k]).trim()); ix.forEach(k=>save('mambo:note:'+k,S.note[k])); save('mambo:noteidx',ix); }
  if(d.foto){ Object.assign(S.foto,d.foto); const ix=Object.keys(S.foto); ix.forEach(k=>save('mambo:foto:'+k,S.foto[k])); save('mambo:fotoidx',ix); }
  if(d.stepfoto){ Object.assign(S.stepfoto,d.stepfoto); const ix=Object.keys(S.stepfoto); ix.forEach(k=>save('mambo:stepfoto:'+k,S.stepfoto[k])); save('mambo:stepidx',ix); }
  if(d.accfoto){ Object.assign(S.accfoto,d.accfoto); const ix=Object.keys(S.accfoto); ix.forEach(k=>save('mambo:accfoto:'+k,S.accfoto[k])); save('mambo:accfotoidx',ix); }
  if(typeof d.porz==='number'){ S.porz=d.porz; save('mambo:porz',S.porz); }
  if(d.tema){ S.tema=d.tema; save('mambo:tema',S.tema); applyTema(); }
  if(typeof d.cols==='number'){ S.cols=d.cols; save('mambo:cols',S.cols); }
  if(Array.isArray(d.mie)){ const ids=new Set(S.mie.map(r=>r.id)); d.mie.forEach(r=>{ if(r&&r.id&&!ids.has(r.id)){S.mie.push(r);ids.add(r.id);} }); salvaMie(); }
  alert('Backup importato \u2713'); render();
}

   LE MIE RICETTE — editor personale (tutto sul dispositivo)

const CAT_ORD=['Basi e salse','Primi','Secondi','Contorni','Dolci','Colazione'];
const ACCESSORI=['—','Lame','MamboMix','Farfalla','Cestello','Vaporiera'];
function mieId(){ return 'mia-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function ricettaVuota(){ return {id:mieId(), mia:true, nome:'', cat:'Primi', tempo:20, porz:4, vol:1000,
  caraffa:'Acciaio', acc:[], tag:[], ing:[{q:'',u:'g',n:''}],
  steps:[{x:'',t:'',v:'',T:'',P:'',a:'—',b:'—'}], note:[]}; }
function syncMie(){ for(let i=RICETTE.length-1;i>=0;i--) if(RICETTE[i].mia) RICETTE.splice(i,1); RICETTE.push(...S.mie); }
function salvaMie(){ save('mambo:mieric',S.mie); syncMie(); }
function apriEditor(id){ const r=id&&S.mie.find(x=>x.id===id);
  S.draft=r?JSON.parse(JSON.stringify(r)):ricettaVuota(); S.editing=true; S.open=null; render(); }

function leggiForm(){ const d=S.draft; if(!d)return; const g=id=>{const e=document.getElementById(id);return e?e.value:'';};
  d.nome=g('ed-nome').trim(); d.cat=g('ed-cat')||'Primi'; d.tempo=Math.max(1,+g('ed-tempo')||1);
  d.porz=Math.min(12,Math.max(1,+g('ed-porz')||1)); d.caraffa=g('ed-caraffa')||'Acciaio';
  d.note=g('ed-note').split('\n').map(s=>s.trim()).filter(Boolean);
  d.ing=d.ing.map((_,i)=>({q:parseFloat((g('ing-q-'+i)||'').replace(',','.'))||0, u:(g('ing-u-'+i)||'g').trim()||'g', n:(g('ing-n-'+i)||'').trim()}));
  d.steps=d.steps.map((_,i)=>({x:(g('st-x-'+i)||'').trim(),
    t:(g('st-t-'+i)||'').trim()||'—', v:(g('st-v-'+i)||'').trim()||'—',
    T:(g('st-T-'+i)||'').trim()||'—', P:(g('st-P-'+i)||'').trim()||'—',
    a:g('st-a-'+i)||'—', b:'—'}));
  d.acc=[...new Set(d.steps.map(s=>s.a).filter(a=>a&&a!=='—'))];
  d.vol=Math.max(300,Math.round(d.ing.reduce((s,i)=>s+(i.q||0),0)/50)*50);
}
function salvaEditor(){ leggiForm(); const d=S.draft;
  if(!d.nome){ alert('Dai un nome alla ricetta.'); return; }
  d.steps=d.steps.filter(s=>s.x);
  if(!d.steps.length){ alert('Scrivi almeno un passaggio.'); return; }
  d.ing=d.ing.filter(i=>i.n);
  const i=S.mie.findIndex(r=>r.id===d.id);
  if(i>=0) S.mie[i]=d; else S.mie.push(d);
  salvaMie(); S.editing=false; const nid=d.id; S.draft=null; S.open=nid; render();
}
function eliminaMia(id){ const d=id?S.mie.find(r=>r.id===id):(S.draft);
  if(!d)return; if(!confirm('Eliminare "'+(d.nome||'questa ricetta')+'"? Non si può annullare.'))return;

/* ---------- FRIGO ---------- */
function vFrigo(){
  const sc=RICETTE.map(r=>{
    const req=r.ing.filter(i=>!i.b);
    const miss=req.filter(i=>{const ni=norm(i.n);
      return !S.frigo.some(p=>{const np=norm(p);return ni.includes(np)||np.includes(ni.split(' ')[0]);});});
    return {r,pct:req.length?Math.round((req.length-miss.length)/req.length*100):100,miss};
  }).filter(x=>x.pct>0).sort((a,b)=>b.pct-a.pct);
  view.innerHTML=`<div class="panel">
    <h2 class="sec" style="margin-top:6px">Cosa ho in frigo</h2>
    <p class="muted" style="font-size:13.5px;margin:8px 0 0">${L('Elenca quello che hai. Sale, olio, farina, zucchero e acqua li do per scontati in dispensa.','Enumera lo que tienes. La sal, el aceite, la harina, el azúcar y el agua los doy por hechos en la despensa.')}</p>
    <div class="inrow"><input id="pin" placeholder="Es. zucchine, gamberetti, uova" enterkeyhint="done"><button id="padd">Aggiungi</button></div>
    ${S.frigo.length?`<div class="mine">${S.frigo.map((p,i)=>`<span class="chip">${esc(p)}<button data-del="${i}" aria-label="Togli">×</button></span>`).join('')}</div>`:''}
    ${!S.frigo.length?`<div class="empty">${L('Aggiungi almeno un ingrediente e ordino i piatti da quelli che puoi già fare stasera.','Añade al menos un ingrediente y ordeno los platos empezando por los que ya puedes hacer esta noche.')}</div>`
      :`<h3 class="sec">Puoi cucinare</h3><div class="grid" data-cols="${S.cols}">${sc.slice(0,24).map(x=>
        tile(x.r,`<span class="pct">${x.pct}%</span>`)).join('')}</div>
        ${sc[0]&&sc[0].miss.length&&sc[0].miss.length<=4?`<div class="note" style="margin-top:14px">Per ${esc(sc[0].r.nome)} ti manca solo: ${sc[0].miss.map(m=>esc(m.n)).join(', ')}.</div>`:''}`}
  </div>`;
  const i=document.getElementById('pin'),a=document.getElementById('padd');
  const push=()=>{const v=i.value.trim();if(!v)return;
    v.split(',').map(s=>s.trim()).filter(Boolean).forEach(s=>{if(!S.frigo.includes(s))S.frigo.push(s);});
    i.value='';save('mambo:frigo',S.frigo);render();document.getElementById('pin').focus();};
  a.onclick=push; i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();push();}};
  view.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.frigo.splice(+b.dataset.del,1);save('mambo:frigo',S.frigo);render();});
}

/* ---------- SPESA ---------- */
const REPARTI=[
 ['Frutta e verdura', /cipoll|carot|sedano|aglio|zucchin|pomodor|patat|melanzan|peperon|zucca|spinac|broccol|cavol|fungh|porr|prezzemol|basilic|limon|arance|mela|pera|radicch|asparag|rapa|insalat|rucol|scalogn|finocch|bietol|fagiolin|pisell|erbette|zenzer|menta|salvia|cetriol|ravanell|verza|cicoria/],
 ['Carne e salumi', /manzo|vitell|maial|pollo|tacchin|salsicc|guancial|pancett|prosciutt|speck|macinat|spezzatin|agnell|wurstel|salame|bresaola|lardo|coppa|mortadell/],
 ['Pesce', /gamber|vongol|cozz|salmon|tonn|seppi|calamar|merluzz|acciugh|bottarg|frutti di mare|baccal|pesce|branzin|orat|polpo|sgombr|platess|spigol|nasell/],
 ['Latticini e uova', /latte|burro|panna|parmigian|pecorin|mozzarell|ricott|gorgonzol|mascarpon|uova|uovo|tuorl|yogurt|stracchin|fontin|grana|taleggi|philadelph|scamorz|caciocavall|provol|formagg|feta|bufala/],
 ['Pasta, riso e pane', /pasta|spaghett|linguin|penne|rigaton|fusill|riso|farin|gnocch|orecchiett|maccheron|lasagn|tortellin|pane|pangrattat|semolin|polent|couscous|biscott|savoiard|sfogli|pizza|croston|tagliatell|bucatin|paccher|ditalin|cannellon/],
 ['Dispensa e conserve', /passata|pelati|concentrat|olio|acet|brodo|ceci|fagiol|lenticch|zucchero|miel|cioccolat|cacao|vino|capper|olive|amido|maizena|bicarbonat|gelatin|colla di pesce|dado|salsa di soia|marmellat|nutella|pinoli|noci|mandorl|uvetta|pistacch|cocco/],
 ['Spezie e aromi', /sale|pepe|peperoncin|noce moscata|cannell|zafferan|origan|rosmarin|allor|curcum|vaniglia|paprik|curry|garofano|cumino|semi/]
];
function reparto(nome){ const n=norm(nome);
  if(/passat|pelati|concentrat|polpa di pomodor/.test(n)) return 'Dispensa e conserve';
  for(const g of REPARTI){ if(g[1].test(n))return g[0]; } return 'Altro'; }
const REP_ORDER=['Frutta e verdura','Carne e salumi','Pesce','Latticini e uova','Pasta, riso e pane','Dispensa e conserve','Spezie e aromi','Altro'];
function inFrigo(nome){ const ni=norm(nome);
  return S.frigo.some(p=>{ const np=norm(p); return np && (ni.includes(np)||np.includes(ni.split(' ')[0])); }); }
/* ---- Allergie e diete: rileva ingredienti non adatti ---- */
const RE_CARNE=/manz|vitell|maial|pollo|tacchin|agnell|conigl|anatra|salsicc|prosciutt|pancett|guancial|speck|salame|mortadell|wurstel|bresaol|lardo|cotechin|zampon|spezzatin|macinat|polpett|arrost|fesa|ragu|guancia|coppa|\bcarne\b|brodo di carne|brodo di pollo|strutto/;
const RE_PESCE=/merluzz|salmon|tonn|acciugh|baccal|branzin|orat|sgombr|platess|spigol|nasell|bottarg|\bpesce\b|vongol|cozz|gamber|scampi|calamar|seppi|polpo|moscard|totan|granchi|aragost|astice|ostrich|frutti di mare|molluschi|crostacei/;
const RE_LATTE=/\blatte\b|burro|panna|formagg|parmigian|pecorin|mozzarell|ricott|mascarpon|gorgonzol|stracchin|fontin|\bgrana\b|taleggi|scamorz|provol|caciocavall|yogurt|bufala|\bfeta\b|besciamell|philadelph|stracciat/;
const RE_UOVA=/uov|tuorl|albume|maionese/;
const DIETE=[
 {id:'glutine', lab:'Senza glutine', re:/farin|pangrattat|\bpane\b|\bpasta\b|spaghett|penne|rigaton|fusill|couscous|semolin|biscott|savoiard|pizza|gnocch|lasagn|tortellin|paccher|bucatin|tagliatell|maccheron|cannellon|ditalin|linguin|orecchiett|\bbirra\b|\borzo\b|seitan|besciamell|farro/},
 {id:'lattosio', lab:'Senza lattosio', re:RE_LATTE},
 {id:'uova', lab:'Senza uova', re:RE_UOVA},
 {id:'naguscio', lab:'Senza frutta a guscio', re:/mandorl|nocciol|\bnoci\b|\bnoce\b|pistacch|anacard|pinoli|arachid/},
 {id:'maiale', lab:'Senza maiale', re:/prosciutt|pancett|guancial|salsicc|\blardo\b|speck|salame|mortadell|\bcoppa\b|maial|wurstel|cotechin|zampon|strutto/},
 {id:'pescecro', lab:'Senza pesce e crostacei', re:RE_PESCE},
 {id:'alcol', lab:'Senza alcol', re:/\bvino\b|liquor|\brum\b|marsala|brandy|cognac|\bbirra\b|grappa|amaretto|limoncell|vermut/},
 {id:'vegetariano', lab:'Vegetariano', veg:1},
 {id:'vegano', lab:'Vegano', veg:2},
];
const DIETLAB=Object.fromEntries(DIETE.map(d=>[d.id,d.lab]));
function ingText(r){ return ' '+norm(r._ingIt || (r.ing||[]).map(i=>i.n).join(' '))+' '; }
function dietaViola(r,id){
  const d=DIETE.find(x=>x.id===id); if(!d)return false;
  const t=ingText(r), tags=r.tag||[];
  if(d.veg){ const carne=tags.includes('carne')||RE_CARNE.test(t), pesce=tags.includes('pesce')||RE_PESCE.test(t);
    if(carne||pesce)return true;
    if(d.veg===2) return RE_LATTE.test(t)||RE_UOVA.test(t)||/\bmiele\b/.test(t);
    return false; }
  return d.re.test(t);
}
function dieteViolate(r){ return S.diete.filter(id=>dietaViola(r,id)).map(id=>DIETLAB[id]); }
/* ---- Diario di cucina (già cucinata + voto personale) ---- */
function oggiISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtData(iso){ if(!iso)return''; const p=iso.split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0].slice(2):''; }
function diarioSet(id,patch){ const nx=Object.assign({},S.diario[id]||{},patch);
  if(!nx.stelle) delete nx.stelle; if(!nx.fatta){ delete nx.fatta; delete nx.date; }
  if(!nx.fatta && !nx.stelle) delete S.diario[id]; else S.diario[id]=nx;
  save('mambo:diario',S.diario); }
function diarioCard(r){
  const d=S.diario[r.id]||{};
  return `<div class="card pad diariocard"><div class="dcrow">
    <div class="stars mine" data-rid="${r.id}">${[1,2,3,4,5].map(s=>`<button class="star${d.stelle>=s?' on':''}" data-mystar="${s}" aria-label="${s} stelle">★</button>`).join('')}<span class="dclbl">${d.stelle?'Il tuo voto':'Dai un voto'}</span></div>
    <button class="cookbtn${d.fatta?' on':''}" data-cook="${r.id}">${d.fatta?`✓ Cucinata il ${fmtData(d.date)}`:'Segna come cucinata'}</button>
  </div></div>`;
}
const GIORNI=[['lun','Lunedì'],['mar','Martedì'],['mer','Mercoledì'],['gio','Giovedì'],['ven','Venerdì'],['sab','Sabato'],['dom','Domenica']];
function daySelect(e){
  return `<select class="daysel" data-day="${e.id}" aria-label="Giorno della settimana">
    <option value=""${!e.day?' selected':''}>— giorno</option>
    ${GIORNI.map(([k,l])=>`<option value="${k}"${e.day===k?' selected':''}>${l}</option>`).join('')}
  </select>`;
}
function menuSettimana(){
  const groups={}; S.spesa.forEach(e=>{ (groups[e.day||'']=groups[e.day||'']||[]).push(e); });
  const order=[...GIORNI.map(g=>g[0]),''];
  const lab=k=>k===''?'Da assegnare a un giorno':GIORNI.find(g=>g[0]===k)[1];
  return order.filter(k=>groups[k]&&groups[k].length).map(k=>
    `<div class="rephead">${lab(k)}</div>`+groups[k].map(e=>{
      const r=RICETTE.find(x=>x.id===e.id); if(!r)return '';
      return `<div class="li menuli"><span class="lbl" data-open="${r.id}">${esc(r.nome)}<small>per ${e.porz} ${e.porz===1?'persona':'persone'}</small></span>
        ${daySelect(e)}<button class="qty rmv" data-rm="${e.id}" aria-label="Togli dal menu">Togli</button></div>`;
    }).join('')
  ).join('');
}
function vSpesa(){
  const agg={};
  S.spesa.forEach(e=>{const r=RICETTE.find(x=>x.id===e.id);if(!r)return;
    r.ing.forEach(i=>{const k=norm(i.n)+'|'+i.u;
      if(!agg[k])agg[k]={n:i.n,u:i.u,q:0,from:[]};
      agg[k].q+=scala(i,r.porz,e.porz);
      if(!agg[k].from.includes(r.nome))agg[k].from.push(r.nome);});});
  const itAll=Object.entries(agg).sort((a,b)=>a[1].n.localeCompare(b[1].n));
  const nascoste=S.soloMancante?itAll.filter(([k,v])=>inFrigo(v.n)).length:0;
  const it=S.soloMancante?itAll.filter(([k,v])=>!inFrigo(v.n)):itAll;
  const groups={}; it.forEach(([k,v])=>{ const rp=reparto(v.n); (groups[rp]=groups[rp]||[]).push([k,v]); });
  const gOrder=REP_ORDER.filter(g=>groups[g]);
  const liHTML=([k,v])=>`<div class="li" data-done="0" data-k="${esc(k)}"><span class="box">✓</span>
        <span class="lbl">${esc(v.n)}<small>${esc(v.from.join(', '))}</small></span>
        <span class="qty">${fmtQ(v.q)} ${esc(v.u)}</span></div>`;
  const listHTML=gOrder.map(g=>`<div class="rephead">${g}</div>`+groups[g].map(liHTML).join('')).join('');
  view.innerHTML=`<div class="panel">
    <h2 class="sec" style="margin-top:6px">Menu e spesa della settimana</h2>
    ${!S.spesa.length?`<div class="empty">Costruisci il menu della settimana: apri le ricette che vuoi cucinare e usa “Aggiungi alla spesa”, poi qui assegni a ogni piatto un giorno. La lista della spesa si crea da sola, con gli ingredienti sommati, ordinati per reparto e già scalati sulle persone.</div>
      <div class="acts"><button class="btn" id="addMenu0">Sfoglia le ricette</button></div>`
    :`<div class="card"><div class="head"><span>${S.spesa.length} ricette · ${it.length} voci</span>
        <div style="display:flex;gap:12px;align-items:center">${S.frigo.length?`<button id="soloManc" class="tglmanc${S.soloMancante?' on':''}">${S.soloMancante?'✓ ':''}Solo il mancante</button>`:''}<button id="clr" style="color:var(--tomato)">Svuota</button></div></div>
      ${listHTML}${nascoste?`<div class="mancnote">Nascoste ${nascoste} voci che hai già nel frigo.</div>`:''}</div>
      <div class="acts"><button class="btn" id="cp">Copia la lista</button></div>
      <h3 class="sec">Menu della settimana <span>assegna un giorno · tocca per aprire</span></h3>
      <div class="card">${menuSettimana()}</div>
      <div class="acts"><button class="btn ghost" id="addMenu">＋ Aggiungi ricette dal catalogo</button></div>`}
  </div>`;
  view.querySelectorAll('select.daysel').forEach(s=>s.onchange=()=>{
    const e=S.spesa.find(x=>x.id===s.dataset.day);
    if(e){ if(s.value)e.day=s.value; else delete e.day; save('mambo:spesa',S.spesa); render(); } });
  view.querySelectorAll('#addMenu,#addMenu0').forEach(am=>am.onclick=()=>{ S.tab='ricette'; S.open=null; render(); window.scrollTo(0,0); });
  view.querySelectorAll('.li[data-k]').forEach(el=>el.onclick=()=>el.dataset.done=el.dataset.done==='1'?'0':'1');
  const sm=document.getElementById('soloManc'); if(sm)sm.onclick=()=>{S.soloMancante=!S.soloMancante;save('mambo:soloMancante',S.soloMancante);render();};
  const c=document.getElementById('clr'); if(c)c.onclick=()=>{S.spesa=[];save('mambo:spesa',S.spesa);render();};
  const cp=document.getElementById('cp');
  if(cp)cp.onclick=async()=>{
    const t='Lista della spesa\n\n'+gOrder.map(g=>g.toUpperCase()+'\n'+groups[g].map(([k,v])=>`• ${v.n} — ${fmtQ(v.q)} ${v.u}`).join('\n')).join('\n\n');
    let ok=false;
    try{ await navigator.clipboard.writeText(t); ok=true; }
    catch(e){ const ta=document.createElement('textarea'); ta.value=t;
      ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta);
      ta.select(); try{ ok=document.execCommand('copy'); }catch(_){}
      document.body.removeChild(ta); }
    cp.textContent = ok?'Copiata ✓':'Non riesco a copiare';
    setTimeout(()=>cp.textContent='Copia la lista',1800); };

/* ---- controlla aggiornamenti (PWA network-first) ---- */
async function controllaAggiornamenti(btn){
  const set=t=>{ if(btn)btn.textContent=t; };
  if(IS_NATIVE){ set('Aggiornamenti dal Play Store'); setTimeout(()=>set('Controlla aggiornamenti'),2600); return; }
  set('Controllo…');
  try{
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.getRegistration();
      if(reg){
        await reg.update();
        if(reg.waiting){ set('Aggiorno…'); reg.waiting.postMessage({type:'SKIP_WAITING'}); return; }
      }
    }
  }catch(e){}
  set('Aggiorno…');
  setTimeout(()=>location.reload(),300); // network-first: ricarica prende le ricette più recenti
}

const UMIS=[['cucchiaio','Cucchiaio (15 ml)'],['cucchiaino','Cucchiaino (5 ml)'],['bicchiere','Bicchiere (200 ml)'],['tazza','Tazza (250 ml)'],['ml','Millilitri']];
const UML={cucchiaio:15,cucchiaino:5,bicchiere:200,tazza:250,ml:1};
const UDENS=[['acqua','Acqua',1],['latte','Latte',1.03],['olio','Olio',0.91],['farina','Farina 00',0.55],['zucchero','Zucchero',0.85],['zvelo','Zucchero a velo',0.56],['sale','Sale fino',1.2],['miele','Miele',1.42],['panna','Panna',1],['cacao','Cacao amaro',0.45],['riso','Riso',0.85],['pane','Pangrattato',0.4]];

function wireUnitConv(){
  const q=document.getElementById('uq'),u=document.getElementById('uu'),i=document.getElementById('ui'),out=document.getElementById('uout');
  if(!q||!u||!i||!out)return;
  const nf=x=>String(x).replace('.',',');
  const upd=()=>{ const n=parseFloat(String(q.value||'').replace(',','.'))||0;
    const ml=n*(UML[u.value]||0), g=ml*(UDMAP[i.value]||0);
    const fg=g>=10?Math.round(g):Math.round(g*10)/10, fml=Math.round(ml);
    out.innerHTML = n>0 ? `<div class="ures"><b>${nf(fg)} g</b><span>circa ${nf(fml)} ml</span></div>`
      : '<div class="muted" style="font-size:13px;padding:4px 2px">Inserisci una quantità.</div>'; };
  [q,u,i].forEach(el=>{ el.oninput=upd; el.onchange=upd; }); upd();
}

    else if(act==='delIng'){ leggiForm(); S.draft.ing.splice(i,1); if(!S.draft.ing.length)S.draft.ing.push({q:'',u:'g',n:''}); vEditor(); }
    else if(act==='addStep'){ leggiForm(); S.draft.steps.push({x:'',t:'',v:'',T:'',P:'',a:'—',b:'—'}); vEditor(); }
    else if(act==='delStep'){ leggiForm(); S.draft.steps.splice(i,1); if(!S.draft.steps.length)S.draft.steps.push({x:'',t:'',v:'',T:'',P:'',a:'—',b:'—'}); vEditor(); }
    return; }
});

/* ---- Rifiniture e notifiche dell'app Android (nessun effetto nel browser) ---- */
async function initNative(){
  if(!IS_NATIVE) return;
  const P=CAP.Plugins||{};
  try{ if(P.SplashScreen) await P.SplashScreen.hide(); }catch(e){}
  try{
    if(P.PushNotifications){
      let stato=(await P.PushNotifications.checkPermissions()).receive;
      if(stato==='prompt'||stato==='prompt-with-rationale'){
        stato=(await P.PushNotifications.requestPermissions()).receive;
      }
      if(stato==='granted') await P.PushNotifications.register();
    }
  }catch(e){}
}

/* ---- PWA: installabile, offline, e sempre aggiornata (network-first) ---- */
function mostraAggiorna(reg){
  if(document.getElementById('updBar'))return;
  const bar=document.createElement('div'); bar.id='updBar'; bar.className='updbar';
  bar.innerHTML='<span>Nuove ricette disponibili</span>';
  const btn=document.createElement('button'); btn.textContent='Aggiorna';
  btn.onclick=()=>{ if(reg&&reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'}); btn.textContent='Aggiorno…'; };
  bar.appendChild(btn); document.body.appendChild(bar);
}
if(!IS_NATIVE && 'serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{ const nw=reg.installing; if(!nw)return;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller)mostraAggiorna(reg); }); });
    }).catch(()=>{});
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      try{ if(sessionStorage.getItem('swReloaded'))return; sessionStorage.setItem('swReloaded','1'); }catch(e){}
      location.reload();
    });
  });
}

/* ---- Barra in basso: resta attaccata allo schermo anche se la pagina e' zoomata.
   Con lo zoom di Safari gli elementi fissi si ancorano alla pagina e la barra
   finisce a meta' schermo: qui la riallineiamo al riquadro davvero visibile.
   A zoom normale non tocca nulla. ---- */
(function(){
  const nav=document.querySelector('nav.tabs'), vv=window.visualViewport;
  if(!nav||!vv) return;
  let attivo=false;
  const sistema=()=>{
    if(vv.scale>1.02){
      const off=(vv.height+vv.offsetTop)-window.innerHeight;
      nav.style.transform='translateY('+Math.round(off)+'px)';
      attivo=true;
    } else if(attivo){ nav.style.transform=''; attivo=false; }
  };
  vv.addEventListener('resize',sistema);
  vv.addEventListener('scroll',sistema);
  sistema();
})();

/* ---- Pulsante "torna su" nelle liste lunghe ---- */
(function(){
  const btn=document.getElementById('toTop'); if(!btn)return;
  const deckEl=document.getElementById('deck');
  let ultimaY=window.scrollY, timer=null;
  const nascondi=()=>{ btn.hidden=true; };
  const mostra=()=>{ btn.hidden=false; clearTimeout(timer); timer=setTimeout(nascondi,4000); };
  const aggiorna=()=>{
    const y=window.scrollY, versoIlBasso=y>ultimaY; ultimaY=y;
    if(deckEl&&deckEl.classList.contains('open')){ nascondi(); return; }
    const lunga=(document.documentElement.scrollHeight-window.innerHeight)>1500;
    if(lunga && y>900 && versoIlBasso) mostra();
    else if(!lunga || y<=900 || !versoIlBasso){ clearTimeout(timer); nascondi(); }
  };
  window.addEventListener('scroll',aggiorna,{passive:true});
  btn.addEventListener('click',()=>{
    const dolce=!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({top:0,behavior:dolce?'smooth':'auto'});
  });
  aggiorna();
})();

/* ---- Blocco zoom: Chrome Android ignora user-scalable=no, quindi fermiamo il
   pinch a due dita via JS. Lo scorrimento a un dito (touches.length===1) resta intatto. */
(function(){
  document.addEventListener('touchmove', function(e){
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, {passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); });
  });
  document.addEventListener('wheel', function(e){ if (e.ctrlKey) e.preventDefault(); }, {passive:false});
})();
