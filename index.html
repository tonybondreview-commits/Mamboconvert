<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120D0B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mamboconvert">
<meta name="mobile-web-app-capable" content="yes">
<title>Mamboconvert — ricette Bimby convertite per Cecotec Mambo Touch</title>
<style>
:root{
  --bg:#120D0B;
  --surf:#241A16;
  --surf2:#31231D;
  --line:rgba(255,236,214,.13);
  --line-2:rgba(255,236,214,.26);
  --cream:#FFF3E4;
  --muted:#B39B87;
  --saffron:#FFB424;
  --tomato:#FF5B36;
  --mint:#3FE0A8;
  --acqua:#2ED0F0;
  --grape:#C46BFF;
  --surfrgb:36,26,22;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.22,.85,.3,1);
}
body.giorno{
  --bg:#F1F0EE;
  --surf:#FFFFFF;
  --surfrgb:255,255,255;
  --surf2:#EBE9E5;
  --line:rgba(40,34,28,.10);
  --line-2:rgba(40,34,28,.22);
  --cream:#2B2B2B;
  --muted:#6E675F;
  --saffron:#D08307;
  --tomato:#D8471F;
  --mint:#0E9E74;
  --acqua:#0E93BE;
  --grape:#7E30C9;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle at 12% -8%, rgba(255,180,36,.20), transparent 46%),
    radial-gradient(circle at 92% 4%, rgba(255,91,54,.16), transparent 42%),
    radial-gradient(circle at 50% 108%, rgba(46,208,240,.11), transparent 52%);
}
body.giorno::before{background:none}
body{
  color:var(--cream);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(74px + env(safe-area-inset-bottom));
  overflow-x:hidden;min-height:100vh;min-height:100dvh;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:500;line-height:1.15}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px;border-radius:6px}

/* ---------- header ---------- */
body.giorno header{background:rgba(241,240,238,.92)}
body.giorno nav.tabs{background:rgba(255,255,255,.97)}
body.giorno .dials{background:radial-gradient(120% 100% at 50% 0%,rgba(222,124,5,.10),rgba(74,45,28,.06))}
body.giorno .trk{stroke:rgba(74,45,28,.13)}
body.giorno .strip{background:#F3EADF}
body.giorno .accpill{background:rgba(139,52,214,.10)}
body.giorno .bimby{background:rgba(222,124,5,.09)}
body.giorno .sw{background:#D8C7B6}
body.giorno .btn{color:#FFF6EC}
body.giorno .li .box{color:#fff}
body.giorno .warn{background:rgba(222,58,22,.09);color:#A82E12}
body.giorno .head,body.giorno .tbl th{background:rgba(74,45,28,.04)}
body.giorno .card,body.giorno ul.ing,body.giorno .step,body.giorno .crow,body.giorno .conv,body.giorno .tile{
  box-shadow:0 1px 2px rgba(74,45,28,.06),0 8px 24px -18px rgba(74,45,28,.5)}
.themeb{
  width:40px;height:40px;border-radius:999px;flex:none;display:grid;place-items:center;
  background:var(--surf2);font-size:17px;transition:transform .5s var(--ease),background .2s
}
.themeb:active{transform:rotate(-40deg) scale(.9)}
header{
  position:sticky;top:0;z-index:40;background:rgba(18,13,11,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:11px 0 11px;padding-top:calc(11px + env(safe-area-inset-top));
}
.hrow{display:flex;align-items:center;gap:12px}
.logo{
  font-family:var(--serif);font-size:19px;letter-spacing:-.015em;flex:1;min-width:0;
  display:flex;align-items:center;gap:9px
}
.logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.logomk{width:44px;height:44px;flex:none;border-radius:50%;object-fit:cover}
.logo em{font-style:normal;background:linear-gradient(96deg,var(--saffron),var(--tomato));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.stepper{display:flex;align-items:center;background:var(--surf2);border-radius:999px;padding:3px;flex:none}
.stepper button{width:32px;height:30px;border-radius:999px;font-size:18px;display:grid;place-items:center;color:var(--cream);transition:transform .12s}
.stepper button:active{transform:scale(.82)}
.stepper button:disabled{opacity:.28}
.stepper .n{
  min-width:56px;text-align:center;font-variant-numeric:tabular-nums;font-size:13.5px;
  font-weight:600;letter-spacing:.01em;transition:transform .18s var(--ease)
}
.stepper .n.bump{transform:scale(1.18)}

/* ---------- tab bar ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:rgba(18,13,11,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)
}
nav.tabs button{flex:1;padding:14px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:11.5px;color:var(--muted);position:relative;transition:color .2s}
nav.tabs button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--ease)}
nav.tabs button:active svg{transform:scale(.85)}
nav.tabs button[aria-selected="true"]{color:var(--saffron)}
nav.tabs button[aria-selected="true"] svg{
  background:linear-gradient(150deg,var(--saffron),var(--tomato));
  color:#fff;stroke:#fff;border-radius:999px;padding:10px;width:48px;height:48px;
  margin:-16px 0 -3px;box-shadow:0 6px 14px -5px rgba(208,131,7,.75);animation:pop .34s var(--ease)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.badge{
  position:absolute;top:5px;left:50%;margin-left:5px;background:var(--tomato);color:#fff;
  font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:999px;
  display:grid;place-items:center;padding:0 4px;animation:pop .3s var(--ease)
}

/* ---------- griglia ricette ---------- */
.panel{padding:16px 0 34px;animation:panelIn .34s var(--ease)}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
body.giorno .hero{box-shadow:0 10px 30px -18px rgba(40,30,20,.45)}
.search{
  display:flex;align-items:center;gap:9px;background:var(--surf);border:1px solid var(--line);
  border-radius:12px;padding:0 13px;margin-bottom:2px;transition:border-color .2s,box-shadow .2s
}
.search:focus-within{border-color:var(--line-2);box-shadow:0 0 0 3px rgba(255,180,36,.14)}
.search svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:1.7;flex:none}
.search input{flex:1;background:none;border:0;padding:16px 0;font-size:16.5px;min-width:0}
.search input:focus{outline:none}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:13px 0 3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  white-space:nowrap;border:1px solid var(--line-2);border-radius:999px;padding:9px 17px;
  font-size:14.5px;color:var(--muted);transition:transform .12s,background .2s,color .2s
}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:linear-gradient(96deg,var(--saffron),var(--tomato));
  border-color:transparent;color:#241108;font-weight:700}
.chip.fv[aria-pressed="true"]{background:linear-gradient(96deg,#FF3D6E,var(--tomato));color:#fff}
.chips.filtri{padding-top:9px}
.chip.fl{font-size:13.5px;padding:8px 14px}
.chip.fl[aria-pressed="true"]{background:linear-gradient(96deg,var(--mint),var(--acqua));border-color:transparent;color:#04281C;font-weight:700}
.chip.clr{color:var(--tomato);border-color:var(--line-2)}
.updrow{display:flex;justify-content:flex-end;margin-top:12px}
.updmini{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--saffron);
  background:var(--surf);border:1px solid var(--line-2);border-radius:999px;padding:9px 15px;transition:transform .12s}
.updmini:active{transform:scale(.95)}

.grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:18px}
.grid[data-cols="2"]{grid-template-columns:1fr 1fr;gap:12px}
.grid[data-cols="2"] .nm{font-size:16px}
.grid[data-cols="2"] .mt{font-size:11.5px;gap:9px}
.grid[data-cols="2"] .lay{padding:36px 12px 12px}
.grid[data-cols="2"] .art{aspect-ratio:1/1}
.toolrow{display:flex;gap:9px;align-items:center;margin-top:13px}
.toolrow .chips{flex:1;min-width:0;padding-top:0;padding-bottom:0}
.cols{display:flex;gap:3px;background:var(--surf2);border-radius:11px;padding:3px;flex:none}
.cols button{width:34px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:transform .12s}
.cols button:active{transform:scale(.9)}
.cols button[aria-pressed="true"]{background:var(--surf);color:var(--saffron)}
.cols svg{width:15px;height:15px;fill:currentColor}
/* accessori illustrati */
.accgrid{display:flex;gap:9px;flex-wrap:wrap;margin-top:2px}
.accitem{
  display:flex;align-items:center;gap:9px;background:var(--surf2);border:1px solid var(--line);
  border-radius:13px;padding:9px 13px 9px 10px;font-size:14.5px;font-weight:600
}
.accitem .ico{width:30px;height:30px;flex:none;color:var(--saffron)}
.accitem small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:1px}
.accpill{display:inline-flex;align-items:center;gap:6px}
.accpill .ico{width:17px;height:17px;color:var(--grape)}
.crow .ico{width:44px;height:44px;flex:none;color:var(--saffron)}
.tile{
  position:relative;border-radius:20px;overflow:hidden;background:var(--surf);
  border:1px solid var(--line);text-align:left;display:block;width:100%;padding:0;
  transition:transform .2s var(--ease),box-shadow .2s;animation:tileIn .4s var(--ease) both;
  content-visibility:auto;contain-intrinsic-size:auto 320px
}
@keyframes tileIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.tile:active{transform:scale(.97)}
@media(hover:hover){.tile:hover{transform:translateY(-3px);box-shadow:0 16px 34px -20px rgba(0,0,0,.7)}
  .tile:hover .art,.tile:hover .art img{transform:scale(1.05)}}
.tile .art{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;transition:transform .45s var(--ease)}
.tile .art svg{display:block;width:100%;height:100%}
.tile .art img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .45s var(--ease)}
.tile .lay{
  position:absolute;left:0;right:0;bottom:0;padding:46px 18px 16px;
  background:linear-gradient(to top,rgba(14,9,7,.96) 34%,rgba(14,9,7,0));
}
.tile .nm{font-family:var(--serif);font-size:22px;line-height:1.15;letter-spacing:-.015em;display:block;color:#FFF3E4}
.tile .mt{font-size:13px;color:rgba(255,243,228,.72);margin-top:6px;display:flex;gap:14px}
.tile .pct{
  position:absolute;top:12px;left:12px;background:rgba(11,14,8,.78);border-radius:9px;
  padding:6px 11px;font-size:13px;font-weight:700;color:#7CE8BE;backdrop-filter:blur(5px);
  font-variant-numeric:tabular-nums
}
.tile .camtag{
  position:absolute;top:11px;right:11px;width:26px;height:26px;border-radius:999px;
  background:rgba(11,14,8,.6);backdrop-filter:blur(5px);display:grid;place-items:center;font-size:12px
}
.empty{
  border:1px dashed var(--line-2);border-radius:16px;padding:30px 20px;text-align:center;
  color:var(--muted);font-size:14px;margin-top:16px;line-height:1.6
}

/* ---------- dettaglio ---------- */
.hero{
  position:relative;margin:16px 0 0;height:312px;overflow:hidden;border-radius:28px;
  background:var(--surf);border:1px solid var(--line)
}
.hero .art,.hero .art svg,.hero img{width:100%;height:222px;object-fit:cover;display:block}
.hero .shade{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(20,24,15,1) 4%,rgba(20,24,15,.35) 46%,rgba(20,24,15,.55) 100%)
}
.hero .htxt{position:absolute;left:20px;right:20px;bottom:24px;text-align:center;animation:heroTxt .5s .06s var(--ease) both}
@keyframes heroTxt{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hero h2{font-family:var(--serif);font-size:31px;letter-spacing:-.02em;line-height:1.1;color:var(--cream)}
.hero .sub{font-size:15px;color:var(--muted);margin-top:9px;letter-spacing:.01em}
.fab{
  position:absolute;top:14px;left:14px;width:44px;height:44px;border-radius:999px;
  background:rgba(11,14,8,.62);backdrop-filter:blur(6px);display:grid;place-items:center;font-size:17px;
  color:#FFF3E4;transition:transform .14s
}
.fab:active{transform:scale(.86)}
.fab.cam{left:auto;right:12px;font-size:15px}

.card{background:var(--surf);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-top:14px}
.card.pad{padding:18px 20px 20px}
.sec2{
  font-family:var(--sans);font-size:23px;font-weight:600;color:var(--cream);
  letter-spacing:-.01em;display:flex;align-items:baseline;gap:9px
}
.sec2 span{font-size:13px;font-weight:400;color:var(--muted)}
.row{display:flex;gap:14px;padding:15px 16px;border-bottom:1px solid var(--line);font-size:15.5px}
.row:last-child{border-bottom:0}
.row .k{width:98px;flex:none;color:var(--muted);font-size:14px}
.row .v{flex:1}
.warn{
  background:rgba(216,88,61,.13);border:1px solid rgba(216,88,61,.35);border-radius:14px;
  padding:14px 16px;margin-top:14px;font-size:14.5px;line-height:1.45;color:#FFB9A6
}
.sec{
  font-family:var(--sans);font-size:23px;font-weight:600;margin:30px 0 4px;display:flex;
  align-items:baseline;gap:10px;letter-spacing:-.01em;color:var(--cream)
}
.sec span{font-size:13px;color:var(--muted);font-weight:400}

ul.ing{list-style:none;margin:6px 0 0;padding:0}
ul.ing li{display:flex;gap:16px;padding:11px 0;align-items:baseline}
ul.ing .q{
  font-variant-numeric:tabular-nums;font-weight:600;flex:none;text-align:right;
  font-size:16px;color:var(--saffron)
}
ul.ing .n{flex:1;font-size:16.5px}
ul.ing .n i{font-style:normal;color:var(--muted);font-size:11.5px;margin-left:6px}

.steps{counter-reset:s;display:flex;flex-direction:column;gap:11px;margin-top:12px}
.step{background:var(--surf);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.step .txt{padding:16px 16px 14px;display:flex;gap:13px;font-size:16px;line-height:1.45}
.step .n{
  counter-increment:s;flex:none;width:26px;height:26px;border-radius:999px;
  border:1px solid var(--line-2);color:var(--saffron);font-size:13px;font-weight:700;
  display:grid;place-items:center;margin-top:2px;font-variant-numeric:tabular-nums
}
.step .stepmedia{display:block;width:100%;height:170px;object-fit:cover;border-bottom:1px solid var(--line)}
.step .stepcam{
  display:flex;align-items:center;gap:7px;margin:0 16px 14px;font-size:12.5px;color:var(--muted);
  border:1px dashed var(--line-2);border-radius:11px;padding:9px 12px;width:calc(100% - 32px);transition:border-color .2s
}
.step .stepcam:active{border-color:var(--saffron)}
.step .stepcam svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7}
.accpill{
  display:inline-block;margin-top:10px;padding:5px 13px;border-radius:999px;font-size:12.5px;
  font-weight:600;color:var(--grape);background:rgba(196,107,255,.14);
  border:1px solid rgba(196,107,255,.4)
}
.step .n::before{content:counter(s)}
/* dosi da inserire in questo passaggio */
.stepadd{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.stepadd .ai{display:inline-flex;gap:6px;align-items:baseline;background:var(--surf2);
  border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:14px;line-height:1.2}
.stepadd .ai b{color:var(--saffron);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stepadd .ai span{color:var(--cream)}
.steplead{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  margin:14px 0 2px;font-weight:600}
/* quadranti — ispirati alla manopola della macchina */
.dials{
  display:flex;gap:4px;padding:18px 8px 16px;border-top:1px solid var(--line);
  background:transparent
}
.dial{flex:1;min-width:0;text-align:center}
.dial svg{display:block;width:100%;max-width:92px;margin:0 auto}
.dial.t .prog{filter:drop-shadow(0 0 4px rgba(63,224,168,.75))}
.dial.v .prog{filter:drop-shadow(0 0 4px rgba(46,208,240,.75))}
.dial.g .prog{filter:drop-shadow(0 0 4px rgba(255,91,54,.7))}
.dial.p .prog{filter:drop-shadow(0 0 4px rgba(255,180,36,.75))}
.dial .un{font-size:15px;font-weight:600;fill:var(--muted)}
.dials{margin:4px 0 2px}
.dial .lb{font-size:13px;color:var(--muted);margin-top:6px}
.dial text{font-family:var(--sans);font-weight:800;fill:var(--cream);letter-spacing:-.02em}
.trk{stroke:rgba(255,236,214,.10)}
.prog{animation:fill .85s var(--ease) both}
@keyframes fill{from{stroke-dasharray:0 400}}
body.giorno .trk{stroke:rgba(80,50,30,.11)}
.dial.off text{fill:var(--muted);opacity:.45}

.fav{
  position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:999px;
  background:rgba(14,9,7,.62);backdrop-filter:blur(6px);display:grid;place-items:center;
  font-size:19px;color:rgba(255,243,228,.55);line-height:1;transition:transform .16s var(--ease)
}
.fav:active{transform:scale(.8)}
.fav[aria-pressed="true"]{color:#FF3D6E;animation:beat .4s var(--ease)}
@keyframes beat{0%{transform:scale(1)}35%{transform:scale(1.35)}70%{transform:scale(.92)}100%{transform:scale(1)}}
.fab.fav2{left:auto;right:70px}
.fab.fav2[aria-pressed="true"]{color:#FF3D6E}

/* tabelle conversione */
.crow{
  background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:15px;
  margin-top:10px;display:flex;gap:14px;align-items:center
}
.crow .mini{display:flex;align-items:center;gap:9px;flex:none}
.crow .mini svg{width:52px;height:52px;display:block}
.crow .arw{color:var(--saffron);font-size:17px}
.crow .cap{flex:1;min-width:0;font-size:14.5px;line-height:1.45}
.crow .cap b{color:var(--cream);font-weight:700;display:block;font-size:15.5px;margin-bottom:3px}
.crow .cap span{color:var(--muted)}
.meter{display:flex;gap:3px;flex:none;width:104px}
.meter i{flex:1;height:26px;border-radius:3px;background:rgba(255,236,214,.10)}
.meter i.on{background:linear-gradient(180deg,var(--saffron),var(--tomato))}
.thermo{flex:none;width:104px;height:10px;border-radius:999px;background:rgba(255,236,214,.10);overflow:hidden}
.thermo i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--acqua),var(--saffron),var(--tomato))}
.strip{display:flex;background:#0D0907;border-top:1px solid var(--line)}
.cell{flex:1;padding:13px 6px 12px;text-align:center;border-left:1px solid rgba(240,238,222,.07);min-width:0}
.cell:first-child{border-left:0}
.cell .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .k{font-size:10.5px;color:var(--muted);margin-top:4px}
.cell.t .v{color:var(--mint)} .cell.v_ .v{color:var(--acqua)}
.cell.g .v{color:var(--tomato)} .cell.p .v{color:var(--saffron)}
.cell.a .v{color:var(--grape);font-size:12px;font-weight:600}
.bimby{display:none;padding:9px 14px;font-size:12px;color:var(--muted);
  border-top:1px solid var(--line);background:rgba(255,180,36,.07)}
body.bimby-on .bimby{display:block}
.bimby b{color:var(--mint);font-weight:600}
.note{
  border-left:3px solid var(--tomato);background:var(--surf);border-radius:0 14px 14px 0;
  padding:14px 16px;font-size:15px;line-height:1.5;margin-top:10px;color:var(--cream)
}
.acts{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}
.btn{
  flex:1;min-width:150px;text-align:center;border-radius:14px;padding:15px 16px;
  font-size:15.5px;font-weight:700;color:#2B1206;
  background:linear-gradient(96deg,var(--saffron),var(--tomato));
  box-shadow:0 6px 18px -8px rgba(255,91,54,.8);transition:transform .14s
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surf);color:var(--cream);border:1px solid var(--line-2);font-weight:500}
.btn.on{background:linear-gradient(96deg,var(--mint),#17B98A);color:#04281C;box-shadow:none}
.btn.play{background:linear-gradient(96deg,var(--acqua),var(--grape));color:#08131F;
  display:flex;align-items:center;justify-content:center;gap:8px}
.btn.play svg{width:18px;height:18px;fill:currentColor}
.toggle{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);margin-top:18px}
.sw{width:42px;height:25px;border-radius:999px;background:#4A342A;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:999px;
  background:var(--cream);transition:transform .2s var(--ease)}
.toggle[aria-pressed="true"] .sw{background:linear-gradient(96deg,var(--saffron),var(--tomato))}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(17px)}

/* ---------- foto: pannello di gestione ---------- */
.photobar{
  display:flex;gap:8px;align-items:center;margin-top:12px;background:var(--surf);
  border:1px solid var(--line);border-radius:14px;padding:9px 10px 9px 13px;flex-wrap:wrap
}
.photobar .plab{font-size:12.5px;color:var(--muted);flex:none;display:flex;align-items:center;gap:7px}
.photobar .plab svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}
.photobar input.url{flex:1;min-width:150px;background:var(--surf2);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;font-size:14px}
.photobar .pbtn{background:var(--surf2);border:1px solid var(--line);border-radius:10px;
  padding:10px 13px;font-size:13.5px;font-weight:600;flex:none;display:flex;align-items:center;gap:6px}
.photobar .pbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7}
.photobar .pbtn.rm{color:var(--tomato)}
/* foto reali degli accessori */
.accimg{border-radius:6px;object-fit:cover;background:#fff;vertical-align:middle;display:inline-block}
.accpill .accimg{border-radius:5px;margin-right:1px}
.accman{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
@media(min-width:520px){.accman{grid-template-columns:1fr 1fr}}
.acccard{display:flex;align-items:center;gap:13px;background:var(--surf);border:1px solid var(--line);
  border-radius:16px;padding:12px 13px}
.accthumb{width:56px;height:56px;flex:none;display:grid;place-items:center;border-radius:13px;
  background:var(--surf2);color:var(--saffron);overflow:hidden}
.accthumb .ico{width:54px;height:54px}
.accthumb img.accimg{width:56px;height:56px;border-radius:13px}
.accinfo{flex:1;min-width:0}
.accinfo b{display:block;font-size:15.5px;color:var(--cream)}
.accinfo small{color:var(--muted);font-size:12.5px}
.accbtns{display:flex;flex-direction:column;gap:6px;flex:none}
.accbtns .pbtn{background:var(--surf2);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.accbtns .pbtn.rm{color:var(--tomato)}

/* ---------- MODALITÀ PRESENTAZIONE / SLIDE ---------- */
.deck{position:fixed;inset:0;z-index:80;background:var(--bg);display:none}
.deck.open{display:block}
.deck .track{display:flex;height:100%;transition:transform .45s var(--ease);will-change:transform}
.slide{
  flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;justify-content:flex-start;
  padding:calc(74px + env(safe-area-inset-top)) 22px calc(128px + env(safe-area-inset-bottom));
  scroll-snap-align:start
}
.slide .inner{max-width:640px;margin:0 auto;width:100%;animation:slideUp .5s var(--ease) both}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.slide.cover{text-align:center;justify-content:center}
.slide.cover .sph{width:100%;height:min(46vh,340px);border-radius:26px;overflow:hidden;
  border:1px solid var(--line);margin-bottom:26px;background:var(--surf)}
.slide.cover .sph img,.slide.cover .sph svg{width:100%;height:100%;object-fit:cover;display:block}
.slide.cover .eyebrow{font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--saffron);font-weight:700}
.slide.cover h2{font-family:var(--serif);font-size:clamp(30px,8vw,52px);letter-spacing:-.02em;margin:12px 0 14px;color:var(--cream)}
.slide.cover .csub{color:var(--muted);font-size:16px}
.slide .kicker{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--saffron);font-weight:700;margin-bottom:10px}
.slide .stitle{font-family:var(--serif);font-size:clamp(24px,6vw,38px);line-height:1.14;letter-spacing:-.01em;color:var(--cream)}
.slide .sph2{width:100%;height:min(24vh,190px);border-radius:20px;overflow:hidden;border:1px solid var(--line);
  margin:12px 0 14px;background:var(--surf)}
.slide .sph2 img,.slide .sph2 svg{width:100%;height:100%;object-fit:cover;display:block}
.slide .stext{font-size:clamp(18px,4.6vw,24px);line-height:1.5;color:var(--cream);margin-top:6px}
.slide .sbimby{margin-top:18px;font-size:14.5px;color:var(--muted);border-left:3px solid var(--mint);
  padding:6px 0 6px 14px}
.slide .sbimby b{color:var(--mint);font-weight:600}
.slide ul.singred{list-style:none;padding:0;margin:14px 0 0}
.slide ul.singred li{display:flex;justify-content:space-between;gap:16px;padding:12px 2px;
  border-bottom:1px solid var(--line);font-size:clamp(16px,4vw,20px)}
.slide ul.singred li .sq{color:var(--saffron);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.slide .sdials{margin-top:8px}
.slide .sdials .dials{padding:10px 6px 4px}
.timer{margin-top:14px;display:flex;align-items:center;gap:16px;background:var(--surf);
  border:1px solid var(--line);border-radius:18px;padding:13px 16px}
.timer .tdisp{font-size:clamp(30px,9vw,46px);font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;color:var(--cream);min-width:2.6em}
.timer .tbtn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border-radius:12px;
  padding:13px 20px;font-size:15px;font-weight:700;color:#241108;
  background:linear-gradient(96deg,var(--saffron),var(--tomato));white-space:nowrap;transition:transform .14s}
.timer .tbtn:active{transform:scale(.95)}
.timer .tbtn svg{width:16px;height:16px;fill:currentColor}
.timer.run{border-color:var(--acqua);box-shadow:0 0 0 3px rgba(46,208,240,.16)}
.timer.run .tdisp{color:var(--acqua)}
.timer.run .tbtn{background:var(--surf2);color:var(--cream)}
.timer.done{border-color:var(--mint);box-shadow:0 0 0 3px rgba(63,224,168,.22);animation:done .5s var(--ease)}
.timer.done .tdisp{color:var(--mint)}
@keyframes done{0%,100%{transform:none}30%{transform:scale(1.03)}}
.deckbar{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:12px;
  padding:calc(14px + env(safe-area-inset-top)) 18px 16px;
  background:linear-gradient(to bottom,var(--bg) 55%,transparent)}
.deckbar .dtitle{flex:1;min-width:0;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deckbar button{width:40px;height:40px;border-radius:999px;background:var(--surf2);display:grid;place-items:center;font-size:16px;flex:none}
.deckbar .pdf{width:auto;padding:0 15px;font-size:13.5px;font-weight:600;gap:7px;display:flex;align-items:center}
.deckbar .pdf svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.deckctl{position:absolute;bottom:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:14px;
  padding:16px 20px calc(18px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 58%,transparent)}
.deckctl button.nav{width:52px;height:52px;border-radius:999px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--saffron),var(--tomato));color:#241108;font-size:22px;
  box-shadow:0 8px 20px -8px rgba(255,91,54,.7);transition:transform .14s}
.deckctl button.nav:active{transform:scale(.9)}
.deckctl button.nav:disabled{opacity:.32;box-shadow:none}
.dots{flex:1;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:999px;background:var(--line-2);transition:all .3s var(--ease)}
.dots i.on{width:22px;background:var(--saffron)}
.progline{position:absolute;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--saffron),var(--tomato));
  z-index:3;transition:width .45s var(--ease)}

/* ---------- frigo / spesa ---------- */
.inrow{display:flex;gap:9px;margin-top:12px}
.inrow input{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:12px;
  padding:13px;min-width:0}
.inrow button{background:var(--saffron);color:#191A0F;border-radius:12px;padding:0 18px;font-weight:600;transition:transform .12s}
.inrow button:active{transform:scale(.94)}
.mine{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.mine .chip{background:var(--surf2);border-color:transparent;color:var(--cream);animation:pop .28s var(--ease)}
.mine .chip button{margin-left:8px;color:var(--muted);font-size:15px;line-height:1}
.li{display:flex;gap:14px;padding:15px 16px;border-bottom:1px solid var(--line);align-items:center}
.li:last-child{border-bottom:0}
.li .box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-2);flex:none;
  display:grid;place-items:center;font-size:12px;color:#191A0F;transition:all .2s var(--ease)}
.li[data-done="1"] .box{background:var(--mint);border-color:var(--mint);transform:scale(1.05)}
.li[data-done="1"] .lbl{text-decoration:line-through;color:var(--muted)}
.li .lbl{flex:1;font-size:16px}
.li .lbl small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.li .qty{font-variant-numeric:tabular-nums;font-size:15px;color:var(--saffron);flex:none;font-weight:700}
.head{padding:11px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);
  display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(255,255,255,.02)}

/* ---------- tabelle ---------- */
.tbl{width:100%;border-collapse:collapse;background:var(--surf);border:1px solid var(--line);
  border-radius:14px;overflow:hidden;margin-top:14px;font-size:15px}
.tbl th{text-align:left;padding:11px 13px;font-size:11.5px;color:var(--muted);font-weight:600;
  border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
.tbl td{padding:14px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{color:var(--muted)}
.tbl b{color:var(--saffron);font-weight:600}
.conv{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.conv label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.conv .r2{display:flex;gap:10px;flex-wrap:wrap}
.conv .r2>div{flex:1;min-width:140px}
.conv select{width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:10px;
  padding:11px;font-size:14.5px}
.cout{margin-top:14px;border-radius:11px;overflow:hidden;border:1px solid var(--line)}
.cnote{font-size:14px;color:var(--cream);padding:11px 13px;background:var(--surf2)}
.bimbyta,.noteta{width:100%;min-height:120px;background:var(--surf2);border:1px solid var(--line);border-radius:12px;
  padding:12px 13px;font-size:15px;line-height:1.5;resize:vertical;color:var(--cream);font-family:var(--sans)}
.bimbyta:focus,.noteta:focus{outline:none;border-color:var(--saffron)}
.noteta{min-height:92px;margin-top:6px}
.tile .notetag{position:absolute;top:11px;right:11px;width:26px;height:26px;border-radius:999px;
  background:rgba(11,14,8,.6);backdrop-filter:blur(5px);display:grid;place-items:center;font-size:12px}
.tile .camtag+.notetag{right:43px}
.brow{display:flex;gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:10px}
.brow .bnum{flex:none;width:24px;height:24px;border-radius:999px;border:1px solid var(--line-2);color:var(--saffron);
  font-size:12.5px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.brow .bbody{flex:1;min-width:0}
.brow .borig{font-size:14.5px;color:var(--muted);margin-bottom:9px;line-height:1.4}
.bparams{display:flex;flex-wrap:wrap;gap:7px}
.bp{display:inline-flex;align-items:center;gap:5px;background:var(--surf2);border:1px solid var(--line);
  border-radius:9px;padding:6px 10px;font-size:13px;color:var(--muted)}
.bp b{color:var(--cream);font-weight:700}
.bp svg,.bp .ico{width:16px;height:16px}
.bp.t b{color:var(--mint)} .bp.v b{color:var(--acqua)} .bp.g b{color:var(--tomato)} .bp.p b{color:var(--saffron)}
.bp.a b{color:var(--grape)}
footer{padding:28px 0 6px;font-size:12px;color:var(--muted);line-height:1.65}
.updbar{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;gap:12px;
  background:var(--surf);border:1px solid var(--line-2);border-radius:999px;padding:9px 9px 9px 18px;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.6);font-size:14px;color:var(--cream);animation:pop .3s var(--ease)}
.updbar button{background:linear-gradient(96deg,var(--saffron),var(--tomato));color:#241108;font-weight:700;
  border-radius:999px;padding:9px 16px;font-size:13.5px}

@media (min-width:560px){ .grid{grid-template-columns:1fr 1fr} .hero{height:340px} .hero h2{font-size:40px} }
@media (min-width:900px){ .grid[data-cols="2"]{grid-template-columns:repeat(3,1fr)} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}
  .deck .track{transition:none!important}}

/* ---------- stampa: le slide diventano pagine PDF ---------- */
@media print{
  @page{margin:14mm}
  header,nav.tabs,.deckbar,.deckctl,.progline,main{display:none!important}
  body{padding:0;background:#fff;color:#111}
  .deck{position:static;display:block!important;background:#fff}
  .deck .track{display:block;transform:none!important}
  .slide{height:auto;min-height:auto;page-break-after:always;break-after:page;display:block;
    padding:0 0 8mm;color:#111}
  .slide .inner{animation:none;max-width:100%}
  .slide .stitle,.slide.cover h2,.slide .stext,.slide.cover .csub,.slide ul.singred li{color:#111}
  .slide .sph,.slide .sph2{height:70mm}
  .slide.cover .sph{height:90mm}
  .dial text{fill:#111}
  .slide .kicker,.slide.cover .eyebrow{color:#c26a12}
}
</style>

 [/latte|panna|mascarpone|ricotta|besciamella|mozzarell|yogurt/,'#EDE5D4'],
 [/pecorino|parmigian|taleggio|formagg/,'#E4C87E'],
 [/manzo|macinat|salsicci|guancial|pancett|carne|pollo/,'#9B4B33'],
 [/patat/,'#DFC994'], [/lenticch/,'#7A6242'], [/ceci/,'#D3B36E'], [/melanzan/,'#6B4C7A'],

 [/sedano/,'#8FA85F'], [/pane|savoiard|farina|pasta|spaghett|penne|bucatin|gnocchi|sfogli/,'#EBD5A4']
];
const RIEMPITIVI=/^(latte|pasta|spaghett|penne|bucatin|maccheron|linguin|tagliatell|sfogli|gnocchi|savoiard|pane|farina|riso |carnaroli|vialone|patat|cipoll|scalogno|aglio|acqua|brodo)/;
function coloriDi(r){
  const forti=[],deboli=[];
  r.ing.forEach(i=>{const n=i.n.toLowerCase();
    for(const [re,c] of COLORI){ if(re.test(n)){
      const dest=RIEMPITIVI.test(n)?deboli:forti;
      if(!forti.includes(c)&&!deboli.includes(c)) dest.push(c);
      break; } }});
  const out=[...forti,...deboli];
  if(!out.length) out.push('#D9C79A');
  while(out.length<3) out.push(mix(out[0],out.length===1?'#3B2E1C':'#FFF3DA',.34));
  return out;
}
function stileDi(r){
  const n=r.nome.toLowerCase(), c=r.cat;
  if(/impasto|pasta fresca/.test(n)) return 'impasto';
  if(/latte di|cioccolata calda|yogurt fatto/.test(n)) return 'bicchiere';
  if(/risotto|risi e bisi/.test(n)) return 'risotto';
  if(/spaghett|linguin|bucatin|tagliatell/.test(n)) return 'lunga';
  if(/pasta |penne|maccheron|gnocchi|lasagn|norma/.test(n)) return 'corta';
  if(/zuppa|minestron|vellutata|crema di|besciamella|maionese|pesto|sugo|rag|marmellata|soffritto|pur/.test(n)) return 'crema';
  if(c==='Dolci') return 'dolce';
  return 'pezzi';
}
function mkRnd(seed){ let s=seed>>>0||7; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0; }
function mix(hex,to,amt){
  const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
  const [r1,g1,b1]=p(hex),[r2,g2,b2]=p(to);
  const f=(a,b)=>Math.round(a+(b-a)*amt).toString(16).padStart(2,'0');
  return '#'+f(r1,r2)+f(g1,g2)+f(b1,b2);
}
function art(r){
  const [c1,c2,c3]=coloriDi(r), st=stileDi(r), R=mkRnd(hash(r.id)), id=r.id;
  let food='';
  const dot=(x,y,rr,c,o)=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr.toFixed(1)}" fill="${c}"${o?` opacity="${o}"`:''}/>`;
  const scatter=(n,rad,minR,maxR,c,cy)=>{let s='';for(let i=0;i<n;i++){
    const a=R()*6.283,d=Math.sqrt(R())*rad; s+=dot(100+Math.cos(a)*d,(cy||104)+Math.sin(a)*d*.9,minR+R()*(maxR-minR),c);} return s;};

  if(st==='lunga'){
    food=`<ellipse cx="100" cy="105" rx="46" ry="40" fill="${c1}" opacity=".55"/>`;
    for(let i=0;i<9;i++){
      const y=70+i*8+R()*3, sw=1+R()*.5;
      food+=`<path d="M46 ${y.toFixed(1)} q27 ${(-10-R()*13).toFixed(1)} 54 0 t54 ${(R()*4-2).toFixed(1)}" fill="none" stroke="${mix('#F0DCA8',c1,.14+R()*.3)}" stroke-width="${(5*sw).toFixed(1)}" stroke-linecap="round"/>`;
    }
    food+=scatter(10,38,3,7,c1)+scatter(9,34,1.8,3.4,c2)+scatter(6,30,1.5,2.8,c3);
  } else if(st==='corta'){
    food=`<ellipse cx="100" cy="105" rx="45" ry="39" fill="${c1}" opacity=".5"/>`;
    for(let i=0;i<14;i++){
      const a=R()*6.283,d=Math.sqrt(R())*36,x=100+Math.cos(a)*d,y=103+Math.sin(a)*d*.86,rot=R()*180;
      food+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(0)})"><rect x="-10" y="-6" width="20" height="12" rx="6" fill="${mix('#F0DCA8',c1,.10+R()*.24)}"/></g>`;
    }
    food+=scatter(9,34,2.6,5.4,c2)+scatter(7,30,1.7,3.2,c3);
  } else if(st==='risotto'){
    food=`<circle cx="100" cy="103" r="48" fill="${mix('#EFE3C4',c1,.4)}"/>
      <circle cx="100" cy="103" r="48" fill="url(#sh${id})"/>`+scatter(52,42,1.4,2.8,mix('#FFF6DE',c1,.16))+scatter(13,36,2.8,5.4,c2)+scatter(8,32,1.8,3.4,c3);
  } else if(st==='crema'){
    food=`<circle cx="100" cy="103" r="49" fill="${c1}"/><circle cx="100" cy="103" r="49" fill="url(#sh${id})"/>`
      +scatter(9,35,2.4,5,mix(c1,'#000',.18))+scatter(8,30,1.9,3.6,c2)+scatter(6,26,1.5,2.8,c3);
  } else if(st==='pezzi'){
    for(let i=0;i<5;i++){
      const a=(i/5)*6.283+R()*.5,d=15+R()*21,x=100+Math.cos(a)*d,y=104+Math.sin(a)*d*.82;
      const w=21+R()*13,h=15+R()*8;
      food+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(R()*140-70).toFixed(0)})"><rect x="${(-w/2).toFixed(1)}" y="${(-h/2).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${(h/2.4).toFixed(1)}" fill="${mix(c1,'#3A2A1E',R()*.28)}"/></g>`;
    }
    food+=scatter(9,34,2,4,c2)+scatter(6,30,1.5,2.8,c3);
  } else if(st==='dolce'){
    food=`<path d="M55 116 q45 -58 90 0 z" fill="${mix(c1,'#F4E9D2',.5)}"/>
      <path d="M67 96 q33 -26 66 0 q-33 16 -66 0 z" fill="${mix(c1,'#E9D7B0',.2)}"/>
      <path d="M55 116 h90 a5 5 0 0 1 -5 10 h-80 a5 5 0 0 1 -5 -10 z" fill="${mix(c1,'#C6A469',.34)}"/>
      <path d="M64 106 q36 -32 72 0" fill="none" stroke="${c2}" stroke-width="5" stroke-linecap="round" opacity=".8"/>`
      +scatter(9,26,1.8,3.4,c3,92);
  } else if(st==='impasto'){
    food=`<ellipse cx="100" cy="110" rx="50" ry="39" fill="${mix('#EFDFB8','#C9A96A',.22)}"/>
      <ellipse cx="85" cy="96" rx="17" ry="12" fill="#FBF0D6" opacity=".5"/>`+scatter(14,52,1.1,2.3,'#FBF3E0',110);
  } else { /* bicchiere */
    food=`<ellipse cx="100" cy="152" rx="44" ry="11" fill="#000" opacity=".3"/><path d="M70 50 h60 l-7 84 a11 11 0 0 1 -11 10 h-24 a11 11 0 0 1 -11 -10 z" fill="${mix(c1,'#F4EBD8',.35)}"/>
      <path d="M74 68 h52 l-6 66 a10 10 0 0 1 -10 9 h-20 a10 10 0 0 1 -10 -9 z" fill="${c1}"/>
      <ellipse cx="100" cy="68" rx="26" ry="7" fill="${mix(c1,'#FFFFFF',.3)}"/>`;
  }
  const piatto = (st==='impasto'||st==='bicchiere') ? '' :
    `<ellipse cx="100" cy="110" rx="68" ry="63" fill="#000" opacity=".26"/>
     <circle cx="100" cy="103" r="65" fill="#F0EBDD"/>
     <circle cx="100" cy="103" r="65" fill="url(#pl${id})"/>
     <circle cx="100" cy="103" r="52" fill="none" stroke="#000" stroke-opacity=".06" stroke-width="1.5"/>`;
  const tavolo = st==='impasto'
    ? `<rect width="200" height="200" fill="#2E1F14"/><rect x="14" y="30" width="172" height="150" rx="8" fill="#563E26"/>`
    : `<rect width="200" height="200" fill="url(#bg${id})"/>`;
  return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${r.nome}">
    <defs>
      <radialGradient id="bg${id}" cx="50%" cy="38%" r="78%">
        <stop offset="0" stop-color="${mix(c1,'#2A1B14',.5)}"/><stop offset="1" stop-color="#160F0C"/>
      </radialGradient>
      <radialGradient id="pl${id}" cx="36%" cy="30%" r="80%">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/><stop offset="1" stop-color="#B9B2A0" stop-opacity=".45"/>
      </radialGradient>
      <radialGradient id="sh${id}" cx="36%" cy="30%" r="76%">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/><stop offset="1" stop-color="#000000" stop-opacity=".16"/>
      </radialGradient>
    </defs>
    ${tavolo}${piatto}${food}</svg>`;
}

/* ============================================================
   QUADRANTI — ogni parametro come manopola con il numero dentro
   ============================================================ */
function secDi(t){
  if(!t||t==='—')return null;
  const h=/([\d,.]+)\s*or[ae]/.exec(t), m=/(\d+)\s*min/.exec(t), sc=/(\d+)\s*sec/.exec(t);
  let v=0; if(h)v+=parseFloat(h[1].replace(',','.'))*3600; if(m)v+=+m[1]*60; if(sc)v+=+sc[1];
  return v||null;
}
function dTempo(t){
  const v=secDi(t); if(v===null)return {d:'—',f:0,off:1};
  const o = v<60?{d:String(v),u:'sec'} : v<3600?{d:String(v%60?Math.round(v/60):v/60),u:'min'}
            : {d:String(v/3600).replace('.',','),u:v/3600===1?'ora':'ore'};
  return {...o, f:Math.min(1,v/2700), off:0};
}
function dVel(v){
  if(!v||v==='—')return {d:'—',f:0,off:1};
  if(/turbo/i.test(v))return {d:'Turbo',f:1,off:0};
  const n=v.match(/\d+/g); if(!n)return {d:v,f:0,off:1};
  const hi=+n[n.length-1];
  return {d:n.length>1?n[0]+'-'+n[1]:n[0], f:hi/10, off:0};
}
function dTemp(T){
  if(!T||T==='—')return {d:'—',f:0,off:1};
  const n=/(\d+)/.exec(T); if(!n)return {d:'—',f:0,off:1};
  const g=+n[1];
  if(/forno/i.test(T))return {d:g+'°',u:'forno',f:1,off:0};
  return {d:g+'°', f:Math.max(.06,(g-30)/90), off:0};
}
function dPot(P){
  if(!P||P==='—')return {d:'—',f:0,off:1};
  const n=P.match(/\d+/g); if(!n)return {d:'—',f:0,off:1};
  const hi=+n[n.length-1];
  return {d:n.length>1?n[0]+'-'+n[1]:n[0], f:hi/10, off:0};
}
const C=2*Math.PI*40, ARC=C*0.75;
function quad(o,grad,lab,cls){
  const d=o.d, u=o.u||'';
  const fs = d.length<=2?31:d.length===3?26:d.length===4?21:17;
  const dy = u? '-.08em' : '.34em';
  return `<div class="dial ${cls}${o.off?' off':''}">
    <svg viewBox="0 0 100 100" role="img" aria-label="${lab} ${d} ${u}">
      <circle class="trk" cx="50" cy="50" r="40" fill="none" stroke-width="9" stroke-linecap="round"
        transform="rotate(135 50 50)" stroke-dasharray="${ARC.toFixed(1)} 400"/>
      ${o.f>0?`<circle class="prog" cx="50" cy="50" r="40" fill="none" stroke="url(#${grad})"
        stroke-width="9" stroke-linecap="round" transform="rotate(135 50 50)"
        stroke-dasharray="${(o.f*ARC).toFixed(1)} 400"/>`:''}
      <text x="50" y="50" dy="${dy}" text-anchor="middle" font-size="${fs}">${d}</text>
      ${u?`<text class="un" x="50" y="50" dy="1.5em" text-anchor="middle">${u}</text>`:''}
    </svg><div class="lb">${lab}</div></div>`;
}
function quadri(s){
  return `<div class="dials">
    ${quad(dTempo(s.t),'gT','tempo','t')}${quad(dVel(s.v),'gV','velocità','v')}
    ${quad(dTemp(s.T),'gG','gradi','g')}${quad(dPot(s.P),'gP','potenza','p')}</div>`;
}
function mini(o,grad){
  const fs=o.d.length<=2?36:o.d.length===3?28:22;
  return `<svg viewBox="0 0 100 100" aria-hidden="true">
    <circle class="trk" cx="50" cy="50" r="40" fill="none" stroke-width="10"/>
    ${o.f>0?`<circle cx="50" cy="50" r="40" fill="none" stroke="url(#${grad})" stroke-width="10"
      stroke-linecap="round" transform="rotate(-90 50 50)" stroke-dasharray="${(o.f*C).toFixed(1)} 400"/>`:''}
    <text x="50" y="50" dy=".34em" text-anchor="middle" font-size="${fs}"
      font-family="system-ui" font-weight="800" fill="#FFF3E4">${o.d}</text></svg>`;
}

/* ============================================================
   DOSI PER PASSAGGIO
   Assegna ogni ingrediente al primo passaggio che lo nomina,
   così ogni step mostra "cosa inserire e quanto" (scalato).
   Match sulla parola principale (prima parola), con fallback
   alle altre parole; radici di 6 caratteri per gestire
   singolare/plurale (zucchina/zucchine).
   ============================================================ */
function radice(w){ return w.slice(0,Math.min(6,w.length)); }
function combacia(tok,w){ const a=radice(w),b=radice(tok); return (a.length>=3&&tok.startsWith(a))||(b.length>=3&&w.startsWith(b)); }
// sinonimi: quando il passaggio usa una parola generica al posto del nome
const ALIAS=[
 [/macinat|manzo|maiale|salsicc|vitello|guancial|pancett|polpa/,'carne'],
 [/spaghett|penne|bucatin|maccheron|linguin|fusill|rigaton|tagliatell|pasta mista|pasta corta/,'pasta'],
 [/tuorl|albumi/,'uova'],
];
function assegnaIng(r){
  const perStep=r.steps.map(()=>[]);
  const toks=r.steps.map(s=>norm(s.x).split(/\s+/).filter(Boolean));
  r.ing.forEach(i=>{
    const nn=norm(i.n);
    const words=nn.split(/\s+/).filter(w=>w.length>=3);
    if(!words.length)return;
    const alias=ALIAS.filter(([re])=>re.test(nn)).map(([,a])=>a);
    const cand=[words[0],...words.slice(1).sort((a,b)=>b.length-a.length),...alias];
    let placed=false;
    for(const w of cand){ if(placed)break;
      for(let si=0; si<toks.length; si++){
        if(toks[si].some(t=>combacia(t,w))){ perStep[si].push(i); placed=true; break; } } }
  });
  return perStep;
}
function dosiHTML(list,r){

/* ============================================================
   MODALITÀ PRESENTAZIONE / SLIDE
   ============================================================ */
const deck=document.getElementById('deck');
const deckTrack=document.getElementById('deckTrack');
const deckDots=document.getElementById('deckDots');
let deckId=null, deckN=0, deckTotal=0;

function slideMediaR(r){
  return S.foto[r.id]?`<img src="${esc(S.foto[r.id])}" alt="${esc(r.nome)}">`:art(r);
}
function slideMediaStep(r,idx){
  const sf=S.stepfoto[stepKey(r.id,idx)];
  if(sf)return `<img src="${esc(sf)}" alt="Passaggio ${idx+1}">`;
  if(S.foto[r.id])return `<img src="${esc(S.foto[r.id])}" alt="${esc(r.nome)}">`;
  return art(r);
}
function buildDeck(){
  const r=RICETTE.find(x=>x.id===deckId); if(!r)return;
  clearTimers();
  document.getElementById('deckTitle').textContent=r.nome;
  const slides=[];
  /* copertina */
  slides.push(`<section class="slide cover"><div class="inner">
    <div class="sph">${slideMediaR(r)}</div>
    <div class="eyebrow">Mamboconvert</div>
    <h2>${esc(r.nome)}</h2>
    <div class="csub">${esc(r.cat)} · ${durata(r.tempo)} · per ${S.porz} ${S.porz===1?'persona':'persone'}</div>
  </div></section>`);
  /* ingredienti */
  slides.push(`<section class="slide"><div class="inner">
    <div class="kicker">Ingredienti · ${S.porz} ${S.porz===1?'persona':'persone'}</div>
    <div class="stitle">Cosa mettere in caraffa</div>
    <ul class="singred">${r.ing.map(i=>`<li><span>${esc(i.n)}</span><span class="sq">${fmtQ(scala(i,r.porz,S.porz))} ${esc(i.u)}</span></li>`).join('')}</ul>
  </div></section>`);
  /* passaggi */
  const add=assegnaIng(r);
  r.steps.forEach((s,idx)=>{const has=s.t!=='—'||s.v!=='—';
    slides.push(`<section class="slide"><div class="inner">
      <div class="kicker">Passaggio ${idx+1} di ${r.steps.length}</div>
      <div class="sph2">${slideMediaStep(r,idx)}</div>
      <div class="stext">${esc(s.x)}${s.a&&s.a!=='—'?` <span class="accpill">${accIco(s.a)}${esc(s.a)}</span>`:''}</div>
      ${dosiHTML(add[idx],r)}
      ${has?`<div class="sdials">${quadri(s)}</div>`:''}
      ${secDi(s.t)?`<div class="timer" data-sec="${secDi(s.t)}"><div class="tdisp">${fmtClock(secDi(s.t))}</div><button class="tbtn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Avvia timer</button></div>`:''}
      ${s.b&&s.b!=='—'?`<div class="sbimby">Sul Bimby: <b>${esc(s.b)}</b></div>`:''}
    </div></section>`);
  });
  /* chiusura */
  slides.push(`<section class="slide cover"><div class="inner">
    <div class="eyebrow">Pronto</div>
    <h2>Buon appetito</h2>
    <div class="csub">${esc(r.nome)} · convertita per Cecotec Mambo Touch${r.note&&r.note.length?` · ${r.note.length} note di conversione`:''}</div>
  </div></section>`);
  deckTotal=slides.length;
  deckTrack.innerHTML=slides.join('');
  deckDots.innerHTML=slides.map((_,i)=>`<i data-goto="${i}"></i>`).join('');
  deckDots.querySelectorAll('[data-goto]').forEach(d=>d.onclick=()=>gotoSlide(+d.dataset.goto));
  if(deckN>=deckTotal)deckN=deckTotal-1;
  applyDeck();
}
function applyDeck(){
  deckTrack.style.transform=`translateX(${-deckN*100}%)`;
  deckDots.querySelectorAll('i').forEach((d,i)=>d.classList.toggle('on',i===deckN));
  document.getElementById('deckPrev').disabled=deckN<=0;
  document.getElementById('deckNext').disabled=deckN>=deckTotal-1;
  document.getElementById('progline').style.width=((deckN+1)/deckTotal*100)+'%';
  const cur=deckTrack.children[deckN];
  if(cur){cur.scrollTop=0;const inner=cur.querySelector('.inner');if(inner){inner.style.animation='none';void inner.offsetWidth;inner.style.animation='';}}
}
function gotoSlide(n){ deckN=Math.max(0,Math.min(deckTotal-1,n)); applyDeck(); }
function openDeck(id){ deckId=id; deckN=0; deck.classList.add('open'); document.body.style.overflow='hidden'; buildDeck(); reqWake(); }
function closeDeck(){ deck.classList.remove('open'); document.body.style.overflow=''; clearTimers(); relWake(); }

/* ---- modalità cottura: timer, avviso, schermo acceso ---- */
function fmtClock(s){const m=Math.floor(s/60),ss=Math.round(s%60);return m+':'+String(ss).padStart(2,'0');}
let wakeLock=null;
async function reqWake(){ try{ if('wakeLock' in navigator){ wakeLock=await navigator.wakeLock.request('screen'); } }catch(e){} }
function relWake(){ try{ wakeLock&&wakeLock.release(); }catch(e){} wakeLock=null; }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&deck.classList.contains('open'))reqWake(); });
let activeTimers=[];
function clearTimers(){ activeTimers.forEach(id=>clearInterval(id)); activeTimers=[]; }
function beep(){ try{const A=window.AudioContext||window.webkitAudioContext; if(!A)return; const a=new A();
  const o=a.createOscillator(),g=a.createGain(); o.connect(g); g.connect(a.destination);
  g.gain.value=.25; o.type='sine'; o.start(); let n=0;
  const iv=setInterval(()=>{ o.frequency.value=n%2?988:660; if(++n>7){clearInterval(iv);o.stop();a.close();} },170);
 }catch(e){} }
function buzz(){ try{ navigator.vibrate&&navigator.vibrate([250,120,250,120,250]); }catch(e){} }
const timerState=new WeakMap();
document.addEventListener('click',e=>{
  const btn=e.target.closest('.tbtn'); if(!btn)return;
  const box=btn.closest('.timer'), disp=box.querySelector('.tdisp');
  let st=timerState.get(box); if(!st){ st={rem:+box.dataset.sec, id:null}; timerState.set(box,st); }
  if(st.id){ clearInterval(st.id); st.id=null; box.classList.remove('run'); btn.lastChild.textContent='Riprendi'; return; }
  if(st.rem<=0){ st.rem=+box.dataset.sec; box.classList.remove('done'); }
  box.classList.add('run'); btn.lastChild.textContent='Pausa';
  st.id=setInterval(()=>{
    st.rem--; disp.textContent=fmtClock(st.rem);
    if(st.rem<=0){ clearInterval(st.id); st.id=null; box.classList.remove('run'); box.classList.add('done');
      btn.lastChild.textContent='Ripeti'; disp.textContent='Fatto!'; beep(); buzz(); }
  },1000);
  activeTimers.push(st.id);
});
document.getElementById('deckClose').onclick=closeDeck;
document.getElementById('deckPrev').onclick=()=>gotoSlide(deckN-1);
document.getElementById('deckNext').onclick=()=>gotoSlide(deckN+1);
document.getElementById('deckPdf').onclick=()=>window.print();
document.addEventListener('keydown',e=>{ if(!deck.classList.contains('open'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){gotoSlide(deckN+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){gotoSlide(deckN-1);}
  else if(e.key==='Escape'){closeDeck();} });
/* swipe */
let tx0=null,ty0=null,swiping=false;
deckTrack.addEventListener('touchstart',e=>{const t=e.touches[0];tx0=t.clientX;ty0=t.clientY;swiping=false;},{passive:true});
deckTrack.addEventListener('touchmove',e=>{if(tx0===null)return;const t=e.touches[0];
  if(Math.abs(t.clientX-tx0)>Math.abs(t.clientY-ty0)+6)swiping=true;},{passive:true});
deckTrack.addEventListener('touchend',e=>{if(tx0===null)return;const dx=e.changedTouches[0].clientX-tx0;
  if(swiping&&Math.abs(dx)>52){ gotoSlide(deckN+(dx<0?1:-1)); } tx0=ty0=null;},{passive:true});

      return !S.frigo.some(p=>{const np=norm(p);return ni.includes(np)||np.includes(ni.split(' ')[0]);});});
    return {r,pct:req.length?Math.round((req.length-miss.length)/req.length*100):100,miss};
  }).filter(x=>x.pct>0).sort((a,b)=>b.pct-a.pct);
  view.innerHTML=`<div class="panel">
    <h2 class="sec" style="margin-top:6px">Cosa ho in frigo</h2>
    <p class="muted" style="font-size:13.5px;margin:8px 0 0">Elenca quello che hai. Sale, olio, farina, zucchero e acqua li do per scontati in dispensa.</p>
    <div class="inrow"><input id="pin" placeholder="Es. zucchine, gamberetti, uova" enterkeyhint="done"><button id="padd">Aggiungi</button></div>
    ${S.frigo.length?`<div class="mine">${S.frigo.map((p,i)=>`<span class="chip">${esc(p)}<button data-del="${i}" aria-label="Togli">×</button></span>`).join('')}</div>`:''}
    ${!S.frigo.length?`<div class="empty">Aggiungi almeno un ingrediente e ordino i piatti da quelli che puoi già fare stasera.</div>`
      :`<h3 class="sec">Puoi cucinare</h3><div class="grid" data-cols="${S.cols}">${sc.slice(0,24).map(x=>
        tile(x.r,`<span class="pct">${x.pct}%</span>`)).join('')}</div>
        ${sc[0]&&sc[0].miss.length&&sc[0].miss.length<=4?`<div class="note" style="margin-top:14px">Per ${esc(sc[0].r.nome)} ti manca solo: ${sc[0].miss.map(m=>esc(m.n)).join(', ')}.</div>`:''}`}
  </div>`;
  const i=document.getElementById('pin'),a=document.getElementById('padd');
  const push=()=>{const v=i.value.trim();if(!v)return;
    v.split(',').map(s=>s.trim()).filter(Boolean).forEach(s=>{if(!S.frigo.includes(s))S.frigo.push(s);});
    i.value='';save('mambo:frigo',S.frigo);render();document.getElementById('pin').focus();};
  a.onclick=push; i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();push();}};
  view.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.frigo.splice(+b.dataset.del,1);save('mambo:frigo',S.frigo);render();});
}

/* ---------- SPESA ---------- */
function vSpesa(){
  const agg={};
  S.spesa.forEach(e=>{const r=RICETTE.find(x=>x.id===e.id);if(!r)return;
    r.ing.forEach(i=>{const k=norm(i.n)+'|'+i.u;
      if(!agg[k])agg[k]={n:i.n,u:i.u,q:0,from:[]};
      agg[k].q+=scala(i,r.porz,e.porz);
      if(!agg[k].from.includes(r.nome))agg[k].from.push(r.nome);});});
  const it=Object.entries(agg).sort((a,b)=>a[1].n.localeCompare(b[1].n));
  view.innerHTML=`<div class="panel">
    <h2 class="sec" style="margin-top:6px">Lista della spesa</h2>
    ${!S.spesa.length?`<div class="empty">Ancora vuota. Apri una ricetta e usa “Aggiungi alla spesa”: le quantità entrano già scalate sulle persone che hai scelto, e qui trovi il tasto per copiare tutto.</div>`
    :`<div class="card"><div class="head"><span>${S.spesa.length} ricette · ${it.length} voci</span>
        <button id="clr" style="color:var(--tomato)">Svuota</button></div>
      ${it.map(([k,v])=>`<div class="li" data-done="0" data-k="${esc(k)}"><span class="box">✓</span>
        <span class="lbl">${esc(v.n)}<small>${esc(v.from.join(', '))}</small></span>
        <span class="qty">${fmtQ(v.q)} ${esc(v.u)}</span></div>`).join('')}</div>
      <div class="acts"><button class="btn" id="cp">Copia la lista</button></div>
      <h3 class="sec">Ricette in lista</h3><div class="card">${S.spesa.map(e=>{
        const r=RICETTE.find(x=>x.id===e.id);
        return `<div class="li"><span class="lbl">${esc(r.nome)}<small>per ${e.porz} ${e.porz===1?'persona':'persone'}</small></span>
          <button class="qty" data-rm="${e.id}" style="color:var(--tomato)">Togli</button></div>`;}).join('')}</div>`}
  </div>`;
  view.querySelectorAll('.li[data-k]').forEach(el=>el.onclick=()=>el.dataset.done=el.dataset.done==='1'?'0':'1');
  const c=document.getElementById('clr'); if(c)c.onclick=()=>{S.spesa=[];save('mambo:spesa',S.spesa);render();};
  const cp=document.getElementById('cp');
  if(cp)cp.onclick=async()=>{
    const t='Lista della spesa\n'+it.map(([k,v])=>`• ${v.n} — ${fmtQ(v.q)} ${v.u}`).join('\n');
    let ok=false;
    try{ await navigator.clipboard.writeText(t); ok=true; }
    catch(e){ const ta=document.createElement('textarea'); ta.value=t;
      ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta);
      ta.select(); try{ ok=document.execCommand('copy'); }catch(_){}
      document.body.removeChild(ta); }
    cp.textContent = ok?'Copiata ✓':'Non riesco a copiare';
    setTimeout(()=>cp.textContent='Copia la lista',1800); };
  view.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{S.spesa=S.spesa.filter(e=>e.id!==b.dataset.rm);save('mambo:spesa',S.spesa);render();});
}

/* ---- controlla aggiornamenti (PWA network-first) ---- */
async function controllaAggiornamenti(btn){
  const set=t=>{ if(btn)btn.textContent=t; };
  set('Controllo…');
  try{
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.getRegistration();
      if(reg){
        await reg.update();
        if(reg.waiting){ set('Aggiorno…'); reg.waiting.postMessage({type:'SKIP_WAITING'}); return; }
      }
    }
  }catch(e){}
  set('Aggiorno…');
  setTimeout(()=>location.reload(),300); // network-first: ricarica prende le ricette più recenti
}
function vConv(){
  const plain=t=>String(t).replace(/<[^>]+>/g,'');
  const rigaVel=([bi,ma,de])=>`<div class="crow">
    <div class="mini">${mini(dVel(bi),'gV')}<span class="arw">→</span>${mini(dVel(plain(ma)),'gV')}</div>
    <div class="cap"><b>${bi} → ${ma}</b><span>${de}</span></div></div>`;
  const rigaTemp=([bi,ma,de])=>{
    const f=/varoma/i.test(bi)?1:dTemp(bi).f||(/sear/i.test(bi)?1:0);
    return `<div class="crow"><div class="cap"><b>${bi} → ${ma}</b><span>${de}</span>
      <div class="thermo" style="width:100%;margin-top:10px"><i style="width:${Math.round(f*100)}%"></i></div></div></div>`;};
  const rigaPot=([pr,po,gr])=>{
    const n=po.match(/\d+/g),hi=n?+n[n.length-1]:0;
    return `<div class="crow"><div class="meter">${[...Array(10)].map((_,i)=>
      `<i class="${i<hi?'on':''}"></i>`).join('')}</div>
      <div class="cap"><b>${pr}</b><span>potenza ${po} · ${gr}</span></div></div>`;};
  const rigaAcc=([bi,ma,de])=>`<div class="crow">${icoAcc(ma)||icoAcc(bi)||''}
    <div class="cap"><b>${bi} → ${ma}</b><span>${de}</span></div></div>`;

  view.innerHTML=`<div class="panel">
    <div class="card" style="margin-top:6px;padding:15px 16px">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <div style="flex:1;min-width:150px">
          <b style="font-size:15.5px;color:var(--cream)">Mamboconvert</b>
          <div class="muted" style="font-size:13px;margin-top:2px">${RICETTE.length} ricette · installala dalla schermata Home</div>
          <div class="muted" style="font-size:12px;margin-top:6px">${CREDITO}</div>
        </div>
        <button class="btn" id="updBtn" style="flex:none;min-width:0;padding:12px 17px">Controlla aggiornamenti</button>
      </div>
    </div>

    <h2 class="sec">Convertitore rapido</h2>
    <p class="muted" style="font-size:14px;margin:8px 0 0">Se preferisci, traduci un singolo passaggio scegliendo dai menu.</p>
    <div class="conv"><div class="r2">
      <div><label for="cv">Velocità Bimby</label><select id="cv">${Object.keys(VELMAP).map(k=>
        `<option value="${k}">${k==='anti'?'Antiorario':k==='spiga'?'Spiga':k==='soft'?'Soft':k==='turbo'?'Turbo':'Velocità '+k}</option>`).join('')}</select></div>
      <div><label for="cp2">Cosa stai facendo</label><select id="cp2">${Object.entries(PREP).map(([k,v])=>
        `<option value="${k}">${v.lab}</option>`).join('')}</select></div></div>
      <div id="cout"></div></div>

    <h3 class="sec">I tuoi accessori <span>foto reali</span></h3>
    <p class="muted" style="font-size:14px;margin:8px 0 0">Carica la foto di ogni pezzo del tuo Mambo (dal telefono o un link non serve: scegli il file). Comparirà come immagine reale in “Ti serve”, nei passaggi e nelle slide.</p>
    <div class="accman">${[['Lame','trita e frulla'],['MamboMix','rimesta e impasta'],['Farfalla','monta ed emulsiona'],['Cestello','cuoce in immersione'],['Vaporiera','cottura al vapore'],['Caraffa','caraffa Acciaio / Habana']].map(([n,u])=>`
      <div class="acccard">
        <div class="accthumb">${accIco(n)}</div>
        <div class="accinfo"><b>${n}</b><small>${u}</small></div>
        <div class="accbtns">
          <button class="pbtn" data-picacc="${n}">${S.accfoto[n]?'Cambia':'Carica foto'}</button>
          ${S.accfoto[n]?`<button class="pbtn rm" data-rmacc="${n}">Rimuovi</button>`:''}
        </div>
      </div>`).join('')}</div>

    <h3 class="sec">Velocità</h3>
    ${T_VEL.map(rigaVel).join('')}

    <h3 class="sec">Temperatura</h3>
    ${T_TEMP.map(rigaTemp).join('')}

    <h3 class="sec">Potenza calorifica <span>il parametro che il Bimby non ha</span></h3>
    <p class="muted" style="font-size:14px;margin:8px 0 0">È la fiamma del fornello, da 0 a 10. Nelle ricette Bimby non è scritta da nessuna parte, va dedotta da cosa stai cuocendo. Stessa temperatura con potenza sbagliata significa fondo bruciato o cottura che non parte.</p>
    ${T_POT.map(rigaPot).join('')}

    <h3 class="sec">Accessori</h3>
    ${T_ACC.map(rigaAcc).join('')}

    <h3 class="sec">Limiti della macchina</h3>
    <div class="card">
      <div class="row"><div class="k">Caraffa</div><div class="v">3,3 L totali · <b style="color:var(--saffron)">2,3 L utili</b></div></div>
      <div class="row"><div class="k">Liquidi</div><div class="v">massimo 2,0 L in ebollizione</div></div>
      <div class="row"><div class="k">A freddo</div><div class="v">massimo 1,5 L per frullare</div></div>
      <div class="row"><div class="k">Impasti</div><div class="v">massimo 600 g di farina</div></div>
      <div class="row"><div class="k">Temperatura</div><div class="v">37 – 120 °C, grado per grado</div></div>
      <div class="row"><div class="k">Timer</div><div class="v">da 1 secondo a 12 ore</div></div>
    </div>
    <footer>Specifiche Mambo Touch verificate sulla scheda prodotto Cecotec. I tempi convertiti sono indicativi: sui sughi lunghi il Mambo chiede in genere il 5-10% in più a parità di risultato.</footer></div>`;

  const cv=document.getElementById('cv'),cp2=document.getElementById('cp2'),out=document.getElementById('cout');
  const upd=()=>{const p=PREP[cp2.value];let vel=VELMAP[cv.value];
    if(p.acc==='Vaporiera')vel='—';
    if((cp2.value==='sugo'||cp2.value==='brasato')&&['0','1','soft','anti'].includes(cv.value))vel='0 – 1 + MamboMix';
    out.innerHTML=`<div class="dials" style="border-radius:12px;margin-top:14px;border-top:0">
      ${quad(dVel(vel),'gV','velocità','v')}${quad(dTemp(p.T?p.T+'°C':'—'),'gG','gradi','g')}
      ${quad(dPot(p.P?String(p.P):'—'),'gP','potenza','p')}</div>
      <div style="text-align:center;margin-top:12px"><span class="accpill">${p.acc}</span></div>
      <div class="cnote" style="margin-top:12px;border-radius:12px">${p.n}</div>`;};
  cv.onchange=upd;cp2.onchange=upd;upd();

  const ub=document.getElementById('updBtn');
  if(ub)ub.onclick=()=>controllaAggiornamenti(ub);
}

/* ---------- EVENTI ---------- */
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.open=null;render();});
document.getElementById('tema').onclick=()=>{
  S.tema=S.tema==='giorno'?'notte':'giorno'; save('mambo:tema',S.tema); applyTema(); };
function bumpN(){const n=document.getElementById('pNum');n.classList.remove('bump');void n.offsetWidth;n.classList.add('bump');}
document.getElementById('pMinus').onclick=()=>{if(S.porz>1){S.porz--;save('mambo:porz',S.porz);applyPorz();if(S.open)vDett();bumpN();}};
document.getElementById('pPlus').onclick=()=>{if(S.porz<12){S.porz++;save('mambo:porz',S.porz);applyPorz();if(S.open)vDett();bumpN();}};
document.addEventListener('click',e=>{
  const pf=e.target.closest('[data-picfoto]'); if(pf){ chiediFile({tipo:'ric',id:pf.dataset.picfoto}); return; }
  const rf=e.target.closest('[data-rmfoto]'); if(rf){ delFoto({tipo:'ric',id:rf.dataset.rmfoto}); render(); return; }
  const ps=e.target.closest('[data-picstep]'); if(ps){ chiediFile({tipo:'step',id:ps.dataset.picstep,i:+ps.dataset.i}); return; }
  const pa=e.target.closest('[data-picacc]'); if(pa){ chiediFile({tipo:'acc',id:pa.dataset.picacc}); return; }
  const ra=e.target.closest('[data-rmacc]'); if(ra){ delFoto({tipo:'acc',id:ra.dataset.rmacc}); render(); return; }
  const dk=e.target.closest('[data-deck]'); if(dk){ openDeck(dk.dataset.deck); return; }
  const fv=e.target.closest('[data-fav]');
  if(fv){ e.stopPropagation(); const id=fv.dataset.fav;
    if(S.pref.includes(id))S.pref=S.pref.filter(x=>x!==id); else S.pref.push(id);
    save('mambo:pref',S.pref); render(); return; }
  const o=e.target.closest('[data-open]'); if(o){S.open=o.dataset.open;render();window.scrollTo(0,0);return;}
  if(e.target.closest('[data-back]')){S.open=null;render();return;}
  const sp=e.target.closest('[data-spesa]');
  if(sp){const id=sp.dataset.spesa;
    if(S.spesa.some(x=>x.id===id))S.spesa=S.spesa.filter(x=>x.id!==id);else S.spesa.push({id,porz:S.porz});
    save('mambo:spesa',S.spesa);render();return;}
  if(e.target.closest('[data-bimby]')){S.bimby=!S.bimby;save('mambo:bimby',S.bimby);render();}
});
(async()=>{
  HOST=await probeHost();
  S.porz=await load('mambo:porz',4); S.frigo=await load('mambo:frigo',[]);
  S.spesa=await load('mambo:spesa',[]); S.bimby=await load('mambo:bimby',false);
  S.pref=await load('mambo:pref',[]); S.cols=await load('mambo:cols',1);
  S.tema=await load('mambo:tema','giorno');
  const ix=await load('mambo:fotoidx',[]);
  for(const id of ix){const d=await load('mambo:foto:'+id,null); if(d)S.foto[id]=d;}
  const six=await load('mambo:stepidx',[]);
  for(const k of six){const d=await load('mambo:stepfoto:'+k,null); if(d)S.stepfoto[k]=d;}
  const aix=await load('mambo:accfotoidx',[]);
  for(const n of aix){const d=await load('mambo:accfoto:'+n,null); if(d)S.accfoto[n]=d;}
  const nix=await load('mambo:noteidx',[]);
  for(const id of nix){const d=await load('mambo:note:'+id,null); if(d)S.note[id]=d;}
  render();
})();

/* ---- PWA: installabile, offline, e sempre aggiornata (network-first) ---- */
function mostraAggiorna(reg){
  if(document.getElementById('updBar'))return;
  const bar=document.createElement('div'); bar.id='updBar'; bar.className='updbar';
  bar.innerHTML='<span>Nuove ricette disponibili</span>';
  const btn=document.createElement('button'); btn.textContent='Aggiorna';
  btn.onclick=()=>{ if(reg&&reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'}); btn.textContent='Aggiorno…'; };
  bar.appendChild(btn); document.body.appendChild(bar);
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{ const nw=reg.installing; if(!nw)return;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller)mostraAggiorna(reg); }); });
    }).catch(()=>{});
    let reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(reloaded)return; reloaded=true; location.reload(); });
  });
}
