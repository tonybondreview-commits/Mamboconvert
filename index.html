,"Aggiungi il latte.":"Añade la leche.","Unisci cacao, farina e sale.":"Añade el cacao, la harina y la sal.","Aggiungi il lievito e amalgama appena.":"Añade la levadura y mezcla apenas.","Versa nello stampo da 24 cm imburrato e infarinato e livella.":"Vierte en el molde de 24 cm untado con mantequilla y enharinado y nivela.","Inforna in forno statico preriscaldato e fai la prova stecchino.":"Hornea con el horno precalentado (calor arriba y abajo) y haz la prueba del palillo.","Sforna, lascia raffreddare e spolvera di zucchero a velo.":"Saca del horno, deja enfriar y espolvorea con azúcar glas.","Trita la cipolla a pezzetti.":"Tritura la cebolla en trocitos.","Riunisci sul fondo e aggiungi l’olio.":"Junta en el fondo y añade el aceite.","Monta la farfalla e unisci tutte le altre verdure a tocchetti, le olive intere, il prezzemolo, il vino, sale e pepe.":"Coloca la mariposa y añade el resto de verduras en trozos, las aceitunas enteras, el perejil, el vino, la sal y la pimienta.","Controlla la cottura e, se serve, prosegui qualche minuto.":"Comprueba la cocción y, si hace falta, sigue unos minutos.","Impiatta e servi.":"Emplata y sirve.","Farcisci le fette di pollo con prosciutto e provola, arrotola e ferma con uno stecchino.":"Rellena los filetes de pollo con jamón y provola, enrolla y sujeta con un palillo.","Infarina leggermente gli involtini.":"Enharina ligeramente los rollitos.","Scalda l’olio con la salvia in caraffa.":"Calienta el aceite con la salvia en el vaso.","Rosola gli involtini a coperchio aperto, girandoli a mano a metà cottura.":"Sofríe los rollitos con la tapa abierta, dándoles la vuelta a mano a media cocción.","Sfuma con il vino, senza dosatore.":"Desglasa con el vino, sin cubilete.","Versa il brodo, sale e pepe e completa la cottura.":"Vierte el caldo, la sal y la pimienta y termina la cocción.","Ammolla i funghi secchi in acqua tiepida 20 minuti, scolali e filtra l’acqua di ammollo.":"Hidrata las setas secas en agua templada 20 minutos, escúrrelas y filtra el agua de remojo.","Unisci la carne infarinata e rosola a coperchio aperto.":"Añade la carne enharinada y sofríe con la tapa abierta.","Aggiungi i funghi, l’acqua filtrata, il brodo e il sale.":"Añade las setas, el agua filtrada, el caldo y la sal.","Prezzemolo tritato a fine cottura.":"Perejil picado al final de la cocción.","Unisci pomodorini tagliati, olive e capperi.":"Añade los tomatitos cortados, las aceitunas y las alcaparras.","Adagia i filetti sul sugo, sala e cuoci senza mescolare: scuoti la caraffa a metà.":"Coloca los filetes sobre la salsa, sala y cocina sin remover: agita el vaso a media cocción.","Prezzemolo a crudo.":"Perejil en crudo.","Trita l’aglio con il peperoncino.":"Tritura el ajo con la guindilla.","Aggiungi l’olio e scalda.":"Añade el aceite y calienta.","Unisci il polpo a pezzi grossi e i pomodorini.":"Añade el pulpo en trozos grandes y los tomatitos.","Cuoci a coperchio chiuso senza aggiungere acqua: il polpo la rilascia da solo.":"Cocina con la tapa cerrada sin añadir agua: el pulpo la suelta solo.","Se resta troppo liquido, ultimi 10 minuti senza dosatore per restringere.":"Si queda demasiado líquido, los últimos 10 minutos sin cubilete para reducir.","Sale e prezzemolo a crudo.":"Sal y perejil en crudo.","Rosola la fesa intera su tutti i lati, girandola a mano.":"Dora la pechuga entera por todos los lados, dándole la vuelta a mano.","Aggiungi le mele a spicchi, il brodo, il rosmarino e il sale.":"Añade las manzanas en gajos, el caldo, el romero y la sal.","Affetta la fesa dopo qualche minuto di riposo e servi con le mele.":"Corta la pechuga en lonchas tras unos minutos de reposo y sirve con las manzanas.","Taglia le carote a rondelle.":"Corta las zanahorias en rodajas.","Metti carote, burro, acqua, sale e timo in caraffa.":"Pon las zanahorias, la mantequilla, el agua, la sal y el tomillo en el vaso.","Scola l’acqua residua, aggiungi il miele e fai glassare senza dosatore.":"Escurre el agua restante, añade la miel y glasea sin cubilete.","Unisci farina, lievito e sale, amalgama senza insistere.":"Añade la harina, la levadura y la sal, mezcla sin insistir.","Versa nello stampo a ciambella e inforna a 175° per 40 minuti.":"Vierte en el molde de corona y hornea a 175° durante 40 minutos.","Farina, burro freddo, zucchero, scorza e sale: sabbia l’impasto a scatti brevi.":"Harina, mantequilla fría, azúcar, ralladura y sal: arenar la masa con golpes cortos.","Aggiungi le uova e impasta appena, fino a formare una palla.":"Añade los huevos y amasa apenas, hasta formar una bola.","Avvolgi e fai riposare in frigo 30 minuti.":"Envuelve y deja reposar en la nevera 30 minutos.","Stendi due terzi dell’impasto, farcisci con la marmellata, decora con le strisce rimaste.":"Estira dos tercios de la masa, rellena con la mermelada, decora con las tiras sobrantes.","Inforna a 180° per 30 minuti.":"Hornea a 180° durante 30 minutos.","Trita le mandorle fino a farina grossolana.":"Tritura las almendras hasta obtener una harina gruesa.","Aggiungi le carote a pezzi e trita fine.":"Añade las zanahorias en trozos y tritura fino.","Unisci uova, zucchero e scorza, monta.":"Añade los huevos, el azúcar y la ralladura, monta.","Aggiungi farina, lievito e sale.":"Añade la harina, la levadura y la sal.","Versa nello stampo e inforna a 170° per 45 minuti.":"Vierte en el molde y hornea a 170° durante 45 minutos.","Unisci farina e lievito, amalgama appena.":"Añade la harina y la levadura, mezcla apenas.","Aggiungi le gocce di cioccolato, mescola un istante a mano, non con le lame.":"Añade las pepitas de chocolate, mezcla un instante a mano, no con las cuchillas.","Versa nello stampo da plumcake e inforna a 175° per 40 minuti.":"Vierte en el molde de plumcake y hornea a 175° durante 40 minutos.","Frulla brevemente le albicocche, lasciando qualche pezzo.":"Tritura brevemente los albaricoques, dejando algún trozo.","Aggiungi zucchero e limone, cuoci con il cestello capovolto al posto del dosatore.":"Añade el azúcar y el limón, cocina con el cestillo del revés en lugar del cubilete.","Prova del piattino: una goccia non deve colare. Se cola, altri 5 minuti.":"Prueba del plato: una gota no debe escurrir. Si escurre, otros 5 minutos.","Trita finemente le nocciole fino a ottenere una pasta.":"Tritura finamente las avellanas hasta obtener una pasta.","Aggiungi zucchero a velo e cacao.":"Añade el azúcar glas y el cacao.","Unisci olio e latte, scalda leggermente per rendere la crema più liscia.":"Añade el aceite y la leche, calienta ligeramente para que la crema quede más fina.","Scalda il latte con lievito e un cucchiaino di zucchero, con il MamboMix.":"Calienta la leche con la levadura y una cucharadita de azúcar, con el MamboMix.","Aggiungi farina, zucchero, uova, scorza e sale, impasta.":"Añade la harina, el azúcar, los huevos, la ralladura y la sal, amasa.","Unisci il burro morbido a pezzetti e continua fino a incordatura.":"Añade la mantequilla blanda en trocitos y sigue hasta que la masa quede elástica.","Lascia lievitare in caraffa chiusa.":"Deja levar en el vaso cerrado.","Forma le brioche, seconda lievitazione fuori dal robot, spennella con il tuorlo e inforna a 190° per 18 minuti.":"Forma los brioches, segundo levado fuera del robot, pincela con la yema y hornea a 190° durante 18 minutos.","Metti tutti gli ingredienti in caraffa.":"Pon todos los ingredientes en el vaso.","Frulla fino a crema liscia, fermandoti a raschiare le pareti se serve.":"Tritura hasta obtener una crema fina, parando a rascar las paredes si hace falta.","Metti tutte le verdure a pezzi grossi nel cestello.":"Pon todas las verduras en trozos grandes en el cestillo.","Acqua e sale in caraffa, cala il cestello e cuoci a coperchio chiuso.":"Agua y sal en el vaso, baja el cestillo y cocina con la tapa cerrada.","Filtra e usa il brodo; le verdure si scartano o si passano.":"Filtra y usa el caldo; las verduras se desechan o se pasan por el pasapurés."};
const NOTE_ES={"La velocità 1 del Mambo con le lame taglia più del senso antiorario del Bimby: monta sempre il MamboMix quando devi solo rimestare.":"La velocidad 1 del Mambo con las cuchillas corta más que el sentido antihorario del Bimby: coloca siempre el MamboMix cuando solo tengas que remover.","Potenza 8 e non 10: sopra questa soglia la cipolla brucia sul fondo in acciaio prima di appassire.":"Potencia 8 y no 10: por encima de ese umbral la cebolla se quema en el fondo de acero antes de pochar.","Qui la potenza bassa (3-4) fa tutto il lavoro: con P8 il latte si attacca al fondo anche a 90°C.":"Aquí la potencia baja (3-4) hace todo el trabajo: con P8 la leche se pega al fondo incluso a 90 °C.","La caraffa Habana è la scelta giusta per tutto ciò che contiene latte, uova o zucchero.":"El vaso Habana es la elección adecuada para todo lo que lleva leche, huevo o azúcar.","Sui sughi lunghi il Mambo chiede 2-3 minuti in più del Bimby a parità di risultato: la potenza calorifica media mantiene un sobbollire più gentile.":"En las salsas de cocción larga el Mambo pide 2-3 minutos más que el Bimby para el mismo resultado: la potencia calorífica media mantiene un hervor más suave.","Un ragù così lungo è il caso perfetto per SlowMambo: se il tuo menu lo prevede, imposta l’ultima fase a 95°C con movimento lento invece della velocità 1.":"Un ragú tan largo es el caso perfecto para SlowMambo: si tu menú lo permite, programa la última fase a 95 °C con movimiento lento en lugar de la velocidad 1.","Non superare 1,8 L in caraffa: il ragù borbotta e schizza sul coperchio.":"No superes los 1,8 L en el vaso: el ragú borbotea y salpica la tapa.","Caraffa e lame vanno fredde: metti la caraffa in freezer 10 minuti prima. Le lame del Mambo scaldano un po’ più di quelle del Bimby e il basilico annerisce.":"El vaso y las cuchillas deben estar fríos: mete el vaso en el congelador 10 minutos antes. Las cuchillas del Mambo calientan un poco más que las del Bimby y la albahaca se ennegrece.","Mai temperatura: qui il campo gradi resta spento.":"Nunca temperatura: aquí el campo de grados queda apagado.","Se impazzisce: svuota, monta un tuorlo nuovo e reincorpora la maionese impazzita a filo alla stessa velocità.":"Si se corta: vacía, monta una yema nueva e incorpora de nuevo la mayonesa cortada en hilo a la misma velocidad.","Il brodo deve essere caldo: il Mambo recupera la temperatura più lentamente del Bimby e il riso si spappolerebbe fuori.":"El caldo debe estar caliente: el Mambo recupera la temperatura más despacio que el Bimby y el arroz se pasaría.","Il MamboMix è obbligatorio, le lame romperebbero i chicchi.":"El MamboMix es obligatorio, las cuchillas romperían los granos.","Con il burro non salire oltre P6 in appassimento: brucia molto prima dell’olio.":"Con la mantequilla no subas de P6 al pochar: se quema mucho antes que el aceite.","Occhio al livello: con più di 6 persone superi la capacità utile di 2,3 L. Meglio due giri.":"Ojo al nivel: con más de 6 personas superas la capacidad útil de 2,3 L. Mejor en dos tandas.","Frulla sempre a caraffa scoperchiata dal solo dosatore, con il cestello sopra: il vapore in pressione fa saltare il coperchio.":"Tritura siempre destapando solo el cubilete, con el cestillo encima: el vapor a presión hace saltar la tapa.","Il sale a inizio cottura indurisce la buccia dei legumi: mettilo negli ultimi 5 minuti.":"La sal al principio de la cocción endurece la piel de las legumbres: añádela en los últimos 5 minutos.","Con la pasta serve potenza alta (9): è l’unico modo per tenere il bollore che scuoce in modo uniforme.":"Con la pasta hace falta potencia alta (9): es la única forma de mantener el hervor que la cuece de manera uniforme.","Il Varoma del Bimby si traduce nella vaporiera a due livelli + caraffa a 120°C con potenza 10: è il vapore a cuocere, non i gradi della caraffa.":"El Varoma del Bimby se traduce en la vaporera de dos niveles + vaso a 120 °C con potencia 10: es el vapor el que cocina, no los grados del vaso.","Impastare troppo sviluppa glutine e rende gli gnocchi gommosi.":"Amasar demasiado desarrolla gluten y deja los ñoquis gomosos.","Il tasto spiga del Bimby non esiste: si traduce sempre in MamboMix a velocità 2-3, mai lame.":"El botón espiga del Bimby no existe: se traduce siempre en MamboMix a velocidad 2-3, nunca cuchillas.","La lievitazione in caraffa a 37°C con potenza 1 è un vantaggio del Mambo: dimezza i tempi in inverno.":"El levado en el vaso a 37 °C con potencia 1 es una ventaja del Mambo: reduce los tiempos a la mitad en invierno.","Non superare 600 g di farina totale: oltre, il motore fatica.":"No superes los 600 g de harina en total: por encima, el motor sufre.","Qui la velocità 0 del Mambo è meglio della velocità 1: le polpette restano intere e il sugo non le sbriciola. Scuoti la caraffa a metà cottura invece di mescolare.":"Aquí la velocidad 0 del Mambo es mejor que la velocidad 1: las albóndigas quedan enteras y la salsa no las desmenuza. Agita el vaso a media cocción en lugar de remover.","La rosolatura a coperchio aperto con potenza 10 è ciò che sul Bimby TM6 faresti con la funzione Sear: il Mambo si ferma a 120°C, quindi serve più tempo e nessun liquido in caraffa.":"El dorado con la tapa abierta a potencia 10 es lo que en el Bimby TM6 harías con la función Sear: el Mambo se queda en 120 °C, así que hace falta más tiempo y nada de líquido en el vaso.","Per il vapore la velocità non conta: quello che serve è potenza 10 sull’acqua. Se metti velocità con la vaporiera montata sprechi solo motore.":"Para el vapor la velocidad no cuenta: lo que hace falta es potencia 10 sobre el agua. Si pones velocidad con la vaporera montada solo desgastas el motor.","Controlla il livello dell’acqua a metà: sotto i 500 ml il vapore cala.":"Comprueba el nivel de agua a media cocción: por debajo de 500 ml el vapor baja.","La farfalla del Mambo ha il rinforzo in silicone: monta meglio del Bimby ma non forzarla sopra velocità 4.":"La mariposa del Mambo tiene refuerzo de silicona: monta mejor que la del Bimby pero no la fuerces por encima de la velocidad 4.","Non frullare con le lame ad alta velocità: l’amido si slega e il purè diventa colloso. È il classico errore di chi passa dal Bimby.":"No tritures con las cuchillas a alta velocidad: el almidón se libera y el puré se vuelve pegajoso. Es el error clásico de quien viene del Bimby.","Velocità 0 tiene le falde intere: è la funzione che il Bimby non ha e che qui conviene sfruttare.":"La velocidad 0 mantiene las tiras enteras: es la función que el Bimby no tiene y que aquí conviene aprovechar.","Puoi usare l’acqua della caraffa per cuocere contemporaneamente la pasta nel cestello: due portate in una.":"Puedes usar el agua del vaso para cocer a la vez la pasta en el cestillo: dos platos en uno.","Questa è la ricetta che spiega meglio la potenza calorifica: 90°C con P4 fa una crema liscia, 90°C con P9 te la brucia sul fondo pur mostrando la stessa temperatura sul display.":"Esta es la receta que mejor explica la potencia calorífica: 90 °C con P4 hace una crema fina, 90 °C con P9 te la quema en el fondo aunque muestre la misma temperatura en la pantalla.","Caraffa Habana obbligatoria se non vuoi grattare il fondo.":"Vaso Habana obligatorio si no quieres rascar el fondo.","Per gli albumi la farfalla del Mambo lavora bene a velocità 4: sopra, l’aria si rompe.":"Para las claras la mariposa del Mambo trabaja bien a velocidad 4: por encima, el aire se rompe.","Se preferisci evitare le uova crude, pastorizza tuorli e zucchero con 80 ml di acqua a 85°C, P3, vel 4 per 4 minuti.":"Si prefieres evitar el huevo crudo, pasteuriza las yemas y el azúcar con 80 ml de agua a 85 °C, P3, vel 4 durante 4 minutos.","Le ricette da forno partono da 8 porzioni: se scali, ricordati che il tempo di cottura in forno non scala in proporzione.":"Las recetas de horno parten de 8 raciones: si ajustas las cantidades, recuerda que el tiempo de horno no se ajusta en la misma proporción.","Oltre gli 85°C la panna stracciona: qui la potenza 3 serve proprio a non superare il set point per inerzia.":"Por encima de 85 °C la nata se corta: aquí la potencia 3 sirve precisamente para no superar el punto fijado por inercia.","110°C è il massimo utile: il Mambo arriva a 120°C ma sopra i 112 lo zucchero comincia a caramellare.":"110 °C es el máximo útil: el Mambo llega a 120 °C pero por encima de 112 el azúcar empieza a caramelizar.","Non riempire oltre 1,5 L: la marmellata sale molto in cottura.":"No llenes más de 1,5 L: la mermelada sube mucho durante la cocción.","Qui il Mambo batte il Bimby: il timer arriva a 12 ore e la temperatura è regolabile grado per grado, quindi fermenti direttamente in caraffa.":"Aquí el Mambo gana al Bimby: el temporizador llega a 12 horas y la temperatura se regula grado a grado, así que fermentas directamente en el vaso.","Non riempire oltre 1,5 L a freddo per frullare: sopra quel livello il vortice spinge il liquido contro il coperchio.":"No llenes más de 1,5 L en frío para triturar: por encima de ese nivel el remolino empuja el líquido contra la tapa.","I gamberetti cuociono in 3-4 minuti: oltre diventano gomma. È il motivo per cui entrano dopo le zucchine e non insieme.":"Las gambas se cuecen en 3-4 minutos: más tiempo y quedan gomosas. Por eso entran después del calabacín y no a la vez.","Se vuoi tutto in caraffa, cuoci la pasta nel cestello con 1 L d’acqua bollente e sposta il condimento in una ciotola nel frattempo.":"Si lo quieres todo en el vaso, cuece la pasta en el cestillo con 1 L de agua hirviendo y pasa el aliño a un cuenco mientras tanto.","Niente parmigiano: con il pesce copre tutto. La cremosità la dà il burro freddo a fuoco spento.":"Nada de parmesano: con el pescado lo tapa todo. La cremosidad la aporta la mantequilla fría con el fuego apagado.","Qui il Mambo vince: potendo impostare 62°C grado per grado con potenza 2, la crema si stabilizza senza mai stracciarsi. Sopra i 68°C l’uovo diventa frittata.":"Aquí el Mambo gana: al poder fijar 62 °C grado a grado con potencia 2, la crema se estabiliza sin cortarse nunca. Por encima de 68 °C el huevo se convierte en tortilla.","Caraffa Habana obbligatoria.":"Vaso Habana obligatorio.","Il guanciale va rosolato a velocità 0: qualsiasi rotazione lo sbriciola.":"El guanciale se sofríe a velocidad 0: cualquier rotación lo desmenuza.","Potenza 5 e non 10: l’olio a 120°C con l’aglio dentro diventa amaro in meno di un minuto.":"Potencia 5 y no 10: el aceite a 120 °C con el ajo dentro se vuelve amargo en menos de un minuto.","60°C con potenza 2 è la temperatura in cui il pecorino si scioglie senza filare. È la differenza tra una crema e una palla di formaggio.":"60 °C con potencia 2 es la temperatura a la que el pecorino se funde sin hacer hilos. Es la diferencia entre una crema y una bola de queso.","Velocità 0 sempre: i gusci a velocità 1 si rompono e finisci con la sabbia nel piatto.":"Velocidad 0 siempre: las conchas a velocidad 1 se rompen y acabas con arenilla en el plato.","1 kg di vongole con i gusci riempie la caraffa: sopra 6 persone fai due giri.":"1 kg de almejas con concha llena el vaso: por encima de 6 personas hazlo en dos tandas.","Frullare metà legumi è il trucco per la cremosità senza panna: vale anche per pasta e fagioli e per le lenticchie.":"Triturar la mitad de las legumbres es el truco para la cremosidad sin nata: sirve también para la pasta con alubias y para las lentejas.","Asciuga la mozzarella un’ora prima o l’acqua slega tutto in forno.":"Seca la mozzarella una hora antes o el agua lo desliga todo en el horno.","Dosi calcolate su 6 porzioni, non su 4 come le altre: la teglia standard è quella.":"Cantidades calculadas para 6 raciones, no para 4 como las demás: la fuente estándar es esa.","La salsiccia rilascia molto grasso: riduci l’olio a 15 ml se la vuoi più leggera.":"La salchicha suelta mucha grasa: reduce el aceite a 15 ml si la quieres más ligera.","Il succo va solo alla fine: se cuoce, l’acidità blocca il rilascio dell’amido e il risotto non lega.":"El zumo va solo al final: si se cuece, la acidez bloquea la liberación del almidón y el risotto no liga.","Va servito col cucchiaio: è una minestra, non un risotto. Se si asciuga troppo aggiungi brodo caldo.":"Se sirve con cuchara: es una sopa, no un risotto. Si se seca demasiado añade caldo caliente.","Regola aurea: 100 g di farina per ogni uovo. Se l’impasto resta briciolo, un cucchiaio d’acqua; se si attacca, un cucchiaio di farina.":"Regla de oro: 100 g de harina por cada huevo. Si la masa queda desmigada, una cucharada de agua; si se pega, una cucharada de harina.","Mai le lame: taglierebbero il glutine che serve a tenere la sfoglia.":"Nunca las cuchillas: cortarían el gluten que hace falta para sostener la masa.","Congelalo negli stampi del ghiaccio: hai il brodo caldo pronto per i risotti, dove serve sempre.":"Congélalo en las cubiteras de hielo: así tienes el caldo caliente listo para los risottos, donde siempre hace falta.","Se hai SlowMambo, questo è il caso ideale: 95°C a movimento lento per 2 ore rende il brodo più limpido.":"Si tienes SlowMambo, este es el caso ideal: 95 °C a movimiento lento durante 2 horas deja el caldo más limpio.","Il sale è il conservante: un cucchiaino di questa crema sostituisce un dado. Dura mesi in frigo.":"La sal es el conservante: una cucharadita de esta pasta sustituye a una pastilla de caldo. Dura meses en la nevera.","Senza pomodoro il rischio di attaccarsi è più alto: tieni sempre un fondo di brodo e potenza bassa.":"Sin tomate el riesgo de que se pegue es mayor: mantén siempre un fondo de caldo y potencia baja.","Per il vitello tonnato classico: niente maionese, la cremosità la danno i tuorli sodi e l’olio a filo.":"Para el vitello tonnato clásico: nada de mayonesa, la cremosidad la dan las yemas cocidas y el aceite en hilo.","Frullare metà legumi è il trucco per la cremosità senza panna, come per pasta e ceci.":"Triturar la mitad de las legumbres es el truco para la cremosidad sin nata, igual que en la pasta con garbanzos.","“Arriminati” vuol dire mescolati: velocità 0 col MamboMix per non ridurre i broccoli in crema.":"«Arriminati» significa removidos: velocidad 0 con el MamboMix para no reducir el brócoli a crema.","Cimette e pasta nella stessa acqua: prima le verdure nel cestello, poi la pasta sotto.":"Ramilletes y pasta en la misma agua: primero las verduras en el cestillo, luego la pasta debajo.","Il farro perlato non va ammollato; quello decorticato sì, altrimenti resta duro.":"La espelta perlada no necesita remojo; la descascarillada sí, de lo contrario queda dura.","Tieni da parte qualche fungo saltato per guarnire: la crema frullata è tutta liscia.":"Reserva algunas setas salteadas para decorar: la crema triturada queda completamente fina.","La menta va a fine cottura: se cuoce, perde il profumo e vira all’amaro.":"La menta va al final de la cocción: si se cuece, pierde el aroma y amarga.","È il minestrone frullato: stesse verdure, ma tutto passato. Ottimo con crostini.":"Es el minestrone triturado: las mismas verduras, pero todo pasado. Estupendo con picatostes.","Il brodo deve bollire quando versi le uova: è così che si formano gli straccetti.":"El caldo debe estar hirviendo cuando viertes los huevos: así se forman los grumos característicos.","Tieni da parte qualche punta cotta al vapore per decorare: nel risotto si ammorbidiscono.":"Reserva algunas puntas cocidas al vapor para decorar: en el risotto se ablandan.","La zucca si spappola e dà cremosità da sola: è un risotto che perdona anche i meno esperti.":"La calabaza se deshace y da cremosidad por sí sola: es un risotto que perdona incluso a los menos expertos.","Una pera cuoce nel risotto e sparisce, l’altra a crudo dà croccantezza e freschezza.":"Una pera se cuece en el risotto y desaparece, la otra en crudo aporta un toque crujiente y fresco.","Caraffa Habana: il formaggio fuso sull’acciaio si attacca. Sotto gli 85°C la crema resta liscia.":"Vaso Habana: el queso fundido se pega sobre el acero. Por debajo de 85 °C la crema queda fina.","Dosi su 6 porzioni: è un piatto da teglia. La pasta molto al dente finisce di cuocere in forno.":"Cantidades para 6 raciones: es un plato de horno. La pasta muy al dente termina de cocerse en el horno.","Mai le lame coi tortellini: li aprirebbero. MamboMix a velocità 1, il minimo che li muove.":"Nunca las cuchillas con los tortellini: los abrirían. MamboMix a velocidad 1, lo mínimo para moverlos.","La farfalla evita che si attacchi sul fondo, il vero problema della polenta nel robot. Coperchio con dosatore aperto: schizza.":"La mariposa evita que se pegue en el fondo, el verdadero problema de la polenta en el robot. Tapa con el cubilete quitado: salpica.","La farina sulle fettine è ciò che lega la salsa: non saltarla.":"La harina en los filetes es lo que liga la salsa: no te la saltes.","Il marsala deve evaporare a coperchio aperto, altrimenti la salsa resta alcolica e dolciastra.":"El marsala debe evaporar con la tapa abierta, de lo contrario la salsa queda alcohólica y dulzona.","Velocità 0 in umido: il pollo a pezzi con l’osso a velocità 1 si sfalda e si attacca alle pale.":"Velocidad 0 en guiso: el pollo troceado con hueso a velocidad 1 se deshace y se pega a las palas.","Affetta l’arrosto solo dopo 10 minuti di riposo, freddo: a caldo si sbriciola.":"Corta el asado en lonchas solo tras 10 minutos de reposo, frío: en caliente se desmigaja.","È la ricetta da SlowMambo per eccellenza: se ce l’hai, l’ultima fase a 95°C a movimento lento è perfetta.":"Es la receta de SlowMambo por excelencia: si lo tienes, la última fase a 95 °C a movimiento lento es perfecta.","Potenza 3: sopra, il brasato bolle e la carne diventa stopposa invece che fondente.":"Potencia 3: por encima, el estofado hierve y la carne queda fibrosa en lugar de tierna.","Velocità 0 e nessuna rotazione: il polpettone resta intero. Giralo a mano scuotendo la caraffa.":"Velocidad 0 y ninguna rotación: el rollo de carne queda entero. Dale la vuelta a mano agitando el vaso.","Le zucchine vanno intiepidite prima delle uova, altrimenti le cuociono e la frittata impazzisce.":"El calabacín hay que templarlo antes de los huevos, de lo contrario los cuece y la tortilla se corta.","Le melanzane fritte in caraffa non si possono fare: vanno cotte a parte, poi solo il sugo nel Mambo.":"Las berenjenas fritas no se pueden hacer en el vaso: se cocinan aparte, luego solo la salsa en el Mambo.","Copri con alluminio i primi 30 minuti, poi scopri per dorare: così il peperone si ammorbidisce dentro.":"Cubre con papel de aluminio los primeros 30 minutos, luego destapa para dorar: así el pimiento se ablanda por dentro.","Le seppie o cuociono pochi minuti o molto a lungo: nel mezzo restano gommose. Qui vanno sul lungo.":"La sepia o se cuece pocos minutos o mucho rato: en el medio queda gomosa. Aquí va de cocción larga.","Velocità 0 sempre: i gusci a velocità 1 si spaccano. 1,5 kg riempie la caraffa, oltre 6 persone fai due giri.":"Velocidad 0 siempre: las conchas a velocidad 1 se rompen. 1,5 kg llena el vaso, por encima de 6 personas hazlo en dos tandas.","Velocità 0 e niente pale contro il pesce: cuoce nel vapore del suo fondo, resta intero.":"Velocidad 0 y nada de palas contra el pescado: se cocina en el vapor de su fondo, queda entero.","La platessa è sottile: 8 minuti bastano. Se la lasci troppo si sfalda tutta.":"La platija es fina: bastan 8 minutos. Si la dejas demasiado se deshace entera.","La caponata è meglio il giorno dopo: l’agrodolce ha bisogno di riposare per amalgamarsi.":"La caponata está mejor al día siguiente: el agridulce necesita reposar para integrarse.","La sbollentata al vapore è il segreto delle patate croccanti fuori e morbide dentro.":"El escaldado al vapor es el secreto de las patatas crujientes por fuera y tiernas por dentro.","Al vapore restano verdi e sodi; lessati in acqua perdono colore e sali.":"Al vapor quedan verdes y firmes; hervidos en agua pierden color y minerales.","A coperchio aperto e potenza alta: i funghi devono asciugarsi, non lessare nella loro acqua.":"Con la tapa abierta y potencia alta: las setas deben secarse, no cocerse en su propia agua.","I finocchi al vapore perdono meno sapore che lessati e non si inzuppano d’acqua.":"Los hinojos al vapor pierden menos sabor que hervidos y no se empapan de agua.","Velocità 0: le cipolline devono restare intere. La glassa si forma solo scoprendo alla fine.":"Velocidad 0: las cebollitas deben quedar enteras. El glaseado se forma solo destapando al final.","Burro freddo e lavorazione lampo: se scaldi la frolla col motore, in forno perde la forma.":"Mantequilla fría y trabajo rápido: si calientas la masa quebrada con el motor, en el horno pierde la forma.","Amalgama la farina il minimo indispensabile: troppo lavoro sviluppa glutine e indurisce.":"Mezcla la harina lo mínimo imprescindible: trabajarla demasiado desarrolla gluten y endurece.","Niente lievito: gonfia solo grazie all’aria delle uova montate. Per questo si monta 8 minuti e si incorpora la farina a mano.":"Sin levadura: sube solo gracias al aire de los huevos montados. Por eso se monta 8 minutos y se incorpora la harina a mano.","Infarina le gocce di cioccolato prima di unirle: così non affondano tutte sul fondo.":"Enharina las pepitas de chocolate antes de añadirlas: así no se van todas al fondo.","Caraffa Habana: latte, zucchero e cacao sull’acciaio si attaccano al primo grado di troppo.":"Vaso Habana: la leche, el azúcar y el cacao se pegan al acero al primer grado de más.","Sopra i 75°C il tuorlo frigge: 70°C con potenza 3 è il punto in cui monta e cuoce insieme.":"Por encima de 75 °C la yema se cuaja: 70 °C con potencia 3 es el punto en el que monta y cuece a la vez.","Il burro va a fuoco spento: è ciò che rende il curd lucido e vellutato. Ottimo su crostate e torte.":"La mantequilla va con el fuego apagado: es lo que da al curd brillo y textura aterciopelada. Estupendo en tartas y bizcochos.","Niente zucchero né uova: dolcifica solo la farina di castagne. Le crepe in superficie sono il segno che è pronto.":"Sin azúcar ni huevo: endulza solo la harina de castañas. Las grietas en la superficie son la señal de que está listo.","Il riposo della pastella fa attivare il lievito: pancake più alti e soffici.":"El reposo de la masa activa la levadura: tortitas más altas y esponjosas.","Serve pazienza: le nocciole diventano pasta solo dopo che si scaldano e rilasciano l’olio. Non aggiungere liquidi prima.":"Hace falta paciencia: las avellanas se convierten en pasta solo después de calentarse y soltar el aceite. No añadas líquidos antes.","Sul bollito misto è d’obbligo. Non salare: acciughe e capperi bastano.":"Con el cocido es imprescindible. No la sales: las anchoas y las alcaparras bastan.","Va usato a crudo sulla pasta calda: se cuoce, i pomodori diventano sugo e perde freschezza.":"Se usa en crudo sobre la pasta caliente: si se cuece, los tomates se hacen salsa y pierde frescura.","L’anatra è grassa: a fine cottura sgrassa la superficie con un cucchiaio.":"El pato es graso: al final de la cocción desengrasa la superficie con una cuchara.","Ottima su tagliatelle, gnocchi o carne. Per una versione liscia, frulla con le lame a fine cottura.":"Estupenda con tallarines, ñoquis o carne. Para una versión fina, tritura con las cuchillas al final de la cocción.","Il burro va nocciola, non bruciato: appena profuma di nocciola togli dal calore.":"La mantequilla debe quedar avellana, no quemada: en cuanto huela a avellana retira del calor.","Caraffa Habana e mai oltre 85°C: i formaggi filano e si separano. Un mestolo di acqua di cottura aiuta la cremosità.":"Vaso Habana y nunca por encima de 85 °C: los quesos hacen hilos y se separan. Un cucharón de agua de cocción ayuda a la cremosidad.","La panna sempre alla fine e a fuoco basso: se bolle a lungo impazzisce.":"La nata siempre al final y a fuego bajo: si hierve mucho rato se corta.","Il salmone affumicato è già cotto: basta scaldarlo, altrimenti diventa stopposo.":"El salmón ahumado ya está cocido: basta con calentarlo, de lo contrario queda seco.","Il sale a fine cottura: sui legumi indurisce la buccia se messo prima.":"La sal al final de la cocción: en las legumbres endurece la piel si se añade antes.","Caraffa Habana: il semolino nel latte si attacca facilmente all’acciaio.":"Vaso Habana: la sémola en la leche se pega con facilidad al acero.","La base bianca: da qui parti per qualsiasi risotto aggiungendo l’ingrediente che vuoi.":"La base blanca: de aquí partes para cualquier risotto añadiendo el ingrediente que quieras.","Piatto povero e confortante: va servito col cucchiaio, non deve asciugare.":"Plato humilde y reconfortante: se sirve con cuchara, no debe quedar seco.","Lo zenzero dà il tocco: dosalo secondo il gusto, parte piccante a caldo.":"El jengibre da el toque: dosifícalo a tu gusto, pica al principio en caliente.","Solo la parte bianca e verde chiara del porro: il verde scuro è duro e fibroso.":"Solo la parte blanca y verde clara del puerro: el verde oscuro es duro y fibroso.","Il segreto è la lenta appassitura delle cipolle: 20 minuti dolci, non fretta e potenza alta.":"El secreto es el pochado lento de las cebollas: 20 minutos suaves, sin prisa ni potencia alta.","Frullare metà dà cremosità senza panna. Un filo d’olio a crudo prima di servire.":"Triturar la mitad da cremosidad sin nata. Un hilo de aceite en crudo antes de servir.","Gli scampi cuociono in pochi minuti: oltre diventano stopposi. Le teste danno sapore, non buttarle subito.":"Las cigalas se cuecen en pocos minutos: más tiempo y quedan secas. Las cabezas dan sabor, no las tires enseguida.","Metà bottarga in mantecatura, metà a crudo: cotta troppo diventa amara.":"Media botarga al ligar, media en crudo: demasiado cocida amarga.","Il ragù napoletano “pippia”: sobbolle piano ore. Potenza 3, mai bollore violento.":"El ragú napolitano «pippia»: hierve suavemente durante horas. Potencia 3, nunca un hervor violento.","La sbollentata al vapore delle patate le rende croccanti fuori e morbide dentro, come per le patate al forno.":"El escaldado al vapor de las patatas las deja crujientes por fuera y tiernas por dentro, igual que en las patatas al horno.","Velocità 0: le pale muoverebbero gli ossibuchi rompendoli. Scuoti la caraffa per non farli attaccare.":"Velocidad 0: las palas moverían los ossobuco y los romperían. Agita el vaso para que no se peguen.","Il coniglio ha ossa piccole: velocità 0 e nessuna rotazione per non spolparlo.":"El conejo tiene huesos pequeños: velocidad 0 y ninguna rotación para no separar la carne del hueso.","Buca le salsicce prima di rosolarle: rilasciano il grasso senza scoppiare.":"Pincha las salchichas antes de sofreírlas: sueltan la grasa sin reventar.","La patata lessa lega l’impasto meglio della sola mollica e tiene morbide le polpette.":"La patata cocida liga la masa mejor que solo la miga y mantiene tiernas las albóndigas.","Intiepidisci le patate prima delle uova, altrimenti le rapprendono.":"Templa las patatas antes de los huevos, de lo contrario los cuajan.","Velocità 0 e nessuna pala: le uova devono rapprendersi nel sugo, non rompersi.":"Velocidad 0 y ninguna pala: los huevos deben cuajar en la salsa, no romperse.","Riempi solo a metà: in cottura il ripieno si gonfia e i calamari si restringono.":"Rellena solo hasta la mitad: al cocinar el relleno se hincha y los calamares encogen.","Il pesce va per ultimo e non si mescola: cuoce nel vapore del fondo e resta intero.":"El pescado va el último y no se remueve: se cocina en el vapor del fondo y queda entero.","La farina sulla carne addensa il fondo: niente amidi a fine cottura.":"La harina en la carne espesa el fondo: nada de almidones al final de la cocción.","Velocità 0: gli involtini a velocità 1 si srotolano. Girali scuotendo la caraffa.":"Velocidad 0: los rollitos a velocidad 1 se desenrollan. Dales la vuelta agitando el vaso.","Il parmigiano nella panatura fa la crosticina dorata anche senza frittura.":"El parmesano en el empanado hace una costra dorada incluso sin fritura.","I gamberi cuociono in 3-4 minuti: appena diventano rosa sono pronti.":"Las gambas se cuecen en 3-4 minutos: en cuanto se ponen rosas están listas.","Il tonno va rosa dentro: pochi minuti per lato, oltre diventa asciutto e stopposo.":"El atún queda rosa por dentro: pocos minutos por lado, más tiempo y queda seco y fibroso.","Coperchio aperto: le zucchine devono asciugare l’acqua, non lessare.":"Tapa abierta: el calabacín debe secar el agua, no cocerse.","Al vapore prima, ripassati poi: restano verdi e saporiti senza spappolarsi.":"Al vapor primero, salteados después: quedan verdes y sabrosos sin deshacerse.","Caraffa Habana per la besciamella. Il cavolfiore al vapore non si inzuppa d’acqua.":"Vaso Habana para la bechamel. La coliflor al vapor no se empapa de agua.","Velocità 0: i cubetti restano interi. Coperchio aperto perché le melanzane rilasciano acqua.":"Velocidad 0: los dados quedan enteros. Tapa abierta porque las berenjenas sueltan agua.","Strizza bene gli spinaci dopo il vapore o il burro non li insaporisce.":"Escurre bien las espinacas después del vapor o la mantequilla no les da sabor.","Le verdure devono essere fredde prima di unire la maionese, altrimenti la stracciano.":"Las verduras deben estar frías antes de añadir la mayonesa, de lo contrario la cortan.","Metà mele nell’impasto, metà a raggiera sopra: dentro morbida, sopra dorata.":"Media manzana en la masa, media en abanico por encima: por dentro jugosa, por encima dorada.","Senza farina: la struttura la danno mandorle e uova. Dentro deve restare umida, non asciugarla troppo.":"Sin harina: la estructura la dan las almendras y los huevos. Por dentro debe quedar húmeda, no la seques demasiado.","Il cioccolato deve essere tiepido, non caldo: se scotta smonta la panna e gli albumi.":"El chocolate debe estar templado, no caliente: si quema baja la nata y las claras.","Tutto freddo e caraffa fredda: la panna monta solo a bassa temperatura. Non superare velocità 4 o si smonta.":"Todo frío y el vaso frío: la nata monta solo a baja temperatura. No superes la velocidad 4 o se baja.","110°C è il massimo utile: oltre lo zucchero caramella. Non riempire oltre 1,5 L, la confettura sale.":"110 °C es el máximo útil: por encima el azúcar caramelia. No llenes más de 1,5 L, la confitura sube.","Burro freddo e lavorazione breve: la frolla non va scaldata o i biscotti perdono forma.":"Mantequilla fría y trabajo breve: la masa quebrada no debe calentarse o las pastas pierden la forma.","Con la banana congelata a pezzi diventa cremoso come un gelato, senza aggiungere zucchero.":"Con el plátano congelado en trozos queda cremoso como un helado, sin añadir azúcar.","Più cuoce, più diventa cremoso. Se si asciuga troppo aggiungi un goccio di latte caldo.":"Cuanto más se cuece, más cremoso queda. Si se seca demasiado añade un chorrito de leche caliente.","Piatto unico: dal secondo passaggio metti 500 g di patate a dadini salate nella vaporiera.":"Plato único: a partir del segundo paso pon 500 g de patata en dados salada en la vaporera.","La velocità Soft antiorario del Bimby diventa velocità 0 con il MamboMix: le cosce restano intere e il fondo non attacca.":"La velocidad Soft antihoraria del Bimby se convierte en velocidad 0 con el MamboMix: los muslos quedan enteros y el fondo no se pega.","Qui il Varoma non è vapore ma rosolatura: in caraffa 120 °C con potenza alta.":"Aquí el Varoma no es vapor sino dorado: en el vaso 120 °C con potencia alta.","Fonte dei parametri Bimby: ricetteperbimby.it (testo e conversione riscritti).":"Fuente de los parámetros Bimby: ricetteperbimby.it (texto y conversión reescritos).","Conversione non letterale: sul Bimby la velocità 4 muove l’acqua sotto il cestello; sul Mambo, con il cestello inserito, la velocità non serve e il vapore lo fa la potenza 10 (velocità 0).":"Conversión no literal: en el Bimby la velocidad 4 mueve el agua bajo el cestillo; en el Mambo, con el cestillo puesto, la velocidad no hace falta y el vapor lo genera la potencia 10 (velocidad 0).","Servono circa 5 minuti in più: con la caraffa piena d’acqua il vapore del Mambo sale più lentamente.":"Hacen falta unos 5 minutos más: con el vaso lleno de agua el vapor del Mambo sube más despacio.","Variante di mare: 200 g di gamberetti al posto del prosciutto, in vaporiera solo negli ultimi 8 minuti.":"Variante de mar: 200 g de gambas en lugar del jamón, en la vaporera solo los últimos 8 minutos.","L’originale usa la farfalla per il pollo; sul Mambo la farfalla non regge i bocconcini infarinati sopra i 100 °C, quindi il MamboMix a 120 °C dà una rosolatura vera.":"El original usa la mariposa para el pollo; en el Mambo la mariposa no aguanta los bocados enharinados por encima de 100 °C, así que el MamboMix a 120 °C da un dorado de verdad.","Salsa di soia sempre alla fine: se cuoce a lungo diventa amara e troppo salata.":"Salsa de soja siempre al final: si se cuece mucho rato amarga y queda demasiado salada.","Il Bimby tosta il riso a 100 °C; sul Mambo conviene salire a 120 °C con potenza 8, così la tostatura sigilla il chicco e il risotto regge meglio la cottura.":"El Bimby tuesta el arroz a 100 °C; en el Mambo conviene subir a 120 °C con potencia 8, así el tostado sella el grano y el risotto aguanta mejor la cocción.","Un minuto in più sul brodo, perché il Mambo recupera la temperatura più lentamente quando versi il liquido.":"Un minuto más con el caldo, porque el Mambo recupera la temperatura más despacio cuando viertes el líquido.","Il brodo deve essere sempre caldo, mai freddo.":"El caldo debe estar siempre caliente, nunca frío.","La velocità 2 antiorario delle zucchine diventa velocità 1 con il MamboMix: a 2 con le lame si sfalderebbero.":"La velocidad 2 antihoraria del calabacín se convierte en velocidad 1 con el MamboMix: a 2 con las cuchillas se desharía.","La mantecatura finale con la scamorza va a 80 °C e potenza 2: sopra, il formaggio fila invece di sciogliersi.":"El ligado final con la scamorza va a 80 °C y potencia 2: por encima, el queso hace hilos en lugar de fundirse.","Un minuto in più di tostatura rispetto all’originale, per compensare la temperatura più bassa del Bimby in quel passaggio.":"Un minuto más de tostado respecto al original, para compensar la temperatura más baja del Bimby en ese paso.","Conversione semplice: qui il Varoma è vapore vero, non rosolatura, quindi restano 120 °C e potenza 10 senza modifiche.":"Conversión sencilla: aquí el Varoma es vapor de verdad, no dorado, así que se quedan 120 °C y potencia 10 sin cambios.","Due minuti in più: la vaporiera del Mambo ha una superficie leggermente diversa e il pesce intero ci mette un filo in più a cuocere fino alla lisca.":"Dos minutos más: la vaporera del Mambo tiene una superficie algo distinta y el pescado entero tarda un poco más en cocerse hasta la espina.","Ricetta per 2 persone: raddoppiando per 4, controlla che le orate entrino nel piano senza sovrapporsi, altrimenti cuoci in due riprese.":"Receta para 2 personas: al doblarla para 4, comprueba que las doradas entren en la bandeja sin superponerse, de lo contrario cocina en dos tandas.","Il cestello nella caraffa, con il trito di aglio e olio sotto, funziona come un vapore aromatizzato: il Mambo lo regge bene con potenza alta e velocità 0, l’acqua bolle sotto e il cestello resta fermo.":"El cestillo en el vaso, con el picado de ajo y aceite debajo, funciona como un vapor aromatizado: el Mambo lo aguanta bien con potencia alta y velocidad 0, el agua hierve debajo y el cestillo queda quieto.","Due minuti in più rispetto all’originale: il cestello del Mambo è leggermente più capiente e il vapore impiega un filo di più a distribuirsi.":"Dos minutos más respecto al original: el cestillo del Mambo es algo más amplio y el vapor tarda un poco más en repartirse.","Dosi per uno stampo da 24 cm.":"Cantidades para un molde de 24 cm.","La temperatura di scioglimento sale a 55 °C ma con potenza 2, non 3: sul Mambo il burro con il cioccolato già tritato brucia più in fretta del Bimby a parità di grado se la potenza è troppo alta.":"La temperatura de fundido sube a 55 °C pero con potencia 2, no 3: en el Mambo la mantequilla con el chocolate ya triturado se quema más rápido que en el Bimby al mismo grado si la potencia es demasiado alta.","Il forno resta invariato: la conversione riguarda solo l’impasto in caraffa.":"El horno no cambia: la conversión afecta solo a la masa en el vaso.","L’ultimo passaggio col lievito scende a velocità 3: a 4 il lievito chimico si attiva troppo in fretta e la torta rischia di sgonfiarsi prima di infornare.":"El último paso con la levadura baja a velocidad 3: a 4 la levadura química se activa demasiado rápido y el bizcocho corre el riesgo de bajarse antes de hornear.","La farfalla sostituisce il MamboMix: con tante verdure diverse a tocchetti tiene meglio la forma di melanzane e zucchine, che con il MamboMix si romperebbero.":"La mariposa sustituye al MamboMix: con tantas verduras distintas en trozos mantiene mejor la forma de berenjenas y calabacines, que con el MamboMix se romperían.","Due minuti in più: la farfalla del Mambo muove il contenuto con meno vigore del senso antiorario del Bimby, utile per non spappolare le verdure ma richiede qualche istante in più per uniformare la cottura.":"Dos minutos más: la mariposa del Mambo mueve el contenido con menos fuerza que el sentido antihorario del Bimby, útil para no deshacer las verduras pero requiere algún instante más para uniformar la cocción.","Il coperchio aperto nei primi passaggi è quello che rosola davvero gli involtini: chiuso, il vapore li lesserebbe.":"La tapa abierta en los primeros pasos es lo que de verdad dora los rollitos: cerrada, el vapor los cocería.","Gira gli involtini a mano invece di alzare la velocità: a qualsiasi velocità rischi di romperli o sfilarli.":"Da la vuelta a los rollitos a mano en lugar de subir la velocidad: a cualquier velocidad corres el riesgo de romperlos o desenrollarlos.","L’acqua di ammollo dei funghi porta un sapore che il brodo da solo non dà: filtrala con un colino fitto.":"El agua de remojo de las setas aporta un sabor que el caldo por sí solo no da: fíltrala con un colador fino.","Il merluzzo si sfalda facilmente: l’ultimo passaggio è a potenza bassa apposta, va scosso a mano invece che mescolato.":"La merluza se deshace con facilidad: el último paso es a potencia baja a propósito, se agita a mano en lugar de remover.","Niente acqua aggiunta: il polpo ne rilascia moltissima, ed è quel liquido a diventare il sugo.":"Nada de agua añadida: el pulpo suelta muchísima, y es ese líquido el que se convierte en la salsa.","Potenza bassa nella cottura principale: ad alta potenza il polpo si contrae e indurisce.":"Potencia baja en la cocción principal: a potencia alta el pulpo se contrae y endurece.","Un pezzo unico da 1 kg va girato a mano ogni 2-3 minuti in rosolatura: nessuna velocità lo gira da solo.":"Una pieza entera de 1 kg hay que darle la vuelta a mano cada 2-3 minutos al dorar: ninguna velocidad la gira sola.","Dosi per 6 persone: è un arrosto da tavola imbandita.":"Cantidades para 6 personas: es un asado para una mesa bien servida.","Il miele va aggiunto solo a fine cottura: prima brucia e rende amare le carote.":"La miel se añade solo al final de la cocción: antes se quema y amarga las zanahorias.","Le ricette da forno partono da 8 porzioni: il tempo di cottura in forno non scala in proporzione con le persone.":"Las recetas de horno parten de 8 raciones: el tiempo de horno no se ajusta en proporción con las personas.","La velocità Turbo a scatti brevi tiene il burro freddo a pezzetti: è il segreto di una frolla che non si ritira in cottura.":"La velocidad Turbo a golpes cortos mantiene la mantequilla fría en trocitos: es el secreto de una masa quebrada que no encoge al hornear.","Niente olio o burro: sono le mandorle a dare umidità, e la torta si mantiene morbida per giorni.":"Nada de aceite ni mantequilla: son las almendras las que dan humedad, y el bizcocho se mantiene jugoso durante días.","Le gocce vanno incorporate a mano: con le lame si tritano e colorano tutto l’impasto.":"Las pepitas se incorporan a mano: con las cuchillas se trituran y tiñen toda la masa.","110°C è il massimo utile prima che lo zucchero cominci a caramellare.":"110 °C es el máximo útil antes de que el azúcar empiece a caramelizar.","Le albicocche rilasciano meno acqua delle fragole: se il frutto è molto maturo, bastano 5 minuti in meno.":"Los albaricoques sueltan menos agua que las fresas: si la fruta está muy madura, bastan 5 minutos menos.","Temperatura bassa apposta: sopra i 60°C il cacao diventa amaro.":"Temperatura baja a propósito: por encima de 60 °C el cacao amarga.","Si conserva in frigo, in un vasetto sterilizzato, per circa due settimane.":"Se conserva en la nevera, en un tarro esterilizado, unas dos semanas.","Non superare 500 g di farina totale: oltre, il motore fatica con un impasto burroso come questo.":"No superes los 500 g de harina en total: por encima, el motor sufre con una masa tan mantecosa como esta.","La lievitazione in caraffa a 37°C dimezza i tempi in inverno rispetto a farla fuori dal robot.":"El levado en el vaso a 37 °C reduce los tiempos a la mitad en invierno respecto a hacerlo fuera del robot.","Tempo indicato senza lievitazione: aggiungi circa 70 minuti di prima lievitazione più la seconda.":"Tiempo indicado sin levado: añade unos 70 minutos de primer levado más el segundo.","Se resta troppo denso, aggiungi acqua un cucchiaio alla volta e frulla ancora 10 secondi.":"Si queda demasiado espeso, añade agua de cucharada en cucharada y tritura 10 segundos más.","Il cestello evita di dover frullare e filtrare: il brodo resta limpido e le verdure si tolgono in un colpo solo.":"El cestillo evita tener que triturar y filtrar: el caldo queda limpio y las verduras se retiran de una sola vez."};
/*T180_ES*/Object.assign(I18N_ES,{"Rosolature e soffritti: la temperatura di lavoro più comune.":"Dorados y sofritos: la temperatura de trabajo más habitual.","Qui il Mambo non ha nulla da invidiare: arriva a 180°C, quindi la rosolatura forte si fa davvero.":"Aquí el Mambo no tiene nada que envidiar: llega a 180 °C, así que el dorado fuerte se hace de verdad.","Il massimo del Mambo: solo a secco, coperchio aperto, per sigillare la carne.":"El máximo del Mambo: solo en seco, tapa abierta, para sellar la carne.","Liquidi":"Líquidos","A freddo":"En frío","Impasti":"Masas","Timer":"Temporizador","2,3 L utili":"2,3 L útiles","massimo 2,0 L in ebollizione":"máximo 2,0 L en ebullición","massimo 1,5 L per frullare":"máximo 1,5 L para triturar","massimo 600 g di farina":"máximo 600 g de harina","37 – 180 °C, grado per grado":"37 – 180 °C, grado a grado","da 1 secondo a 12 ore":"de 1 segundo a 12 horas","Specifiche Mambo Touch verificate sulla scheda prodotto Cecotec. I tempi convertiti sono indicativi: sui sughi lunghi il Mambo chiede in genere il 5-10% in più a parità di risultato.":"Especificaciones del Mambo Touch verificadas en la ficha de producto de Cecotec. Los tiempos convertidos son orientativos: en las salsas de cocción larga el Mambo suele pedir un 5-10 % más para el mismo resultado."});Object.assign(NOTE_ES,{"La rosolatura a coperchio aperto con potenza 10 è la funzione Sear del Bimby TM6: il Mambo arriva a 180°C, quindi la carne si sigilla davvero. Nessun liquido in caraffa finché rosoli.":"El dorado con la tapa abierta a potencia 10 es la función Sear del Bimby TM6: el Mambo llega a 180 °C, así que la carne se sella de verdad. Nada de líquidos en el vaso mientras doras.","110°C è il massimo utile: il Mambo arriva a 180°C, ma sopra i 112 lo zucchero comincia a caramellare.":"110 °C es el máximo útil: el Mambo llega a 180 °C, pero por encima de 112 el azúcar empieza a caramelizar.","Il caramello va sorvegliato a vista: a 130°C passa da ambrato a bruciato in pochi secondi, non allontanarti dalla caraffa.":"El caramelo hay que vigilarlo sin perderlo de vista: a 130 °C pasa de ámbar a quemado en pocos segundos, no te alejes del vaso."});
/*NUOVE2_ES*/Object.assign(NOME_ES,{"Brodo vegetale nel cestello":"Caldo vegetal en el cestillo"});Object.assign(ING_ES,{"pane casereccio":"pan de pueblo","pasta":"pasta","pistacchi sgusciati":"pistachos pelados","trippa pulita":"callos limpios","mentuccia":"menta poleo","amaretti secchi":"amaretti secos","rum":"ron","zucchero per il caramello":"azúcar para el caramelo"});Object.assign(NOME_ES,{"Bruschetta al pomodoro":"Bruschetta de tomate","Crema di carciofi":"Crema de alcachofas","Frittata di zucchine al vapore":"Tortilla de calabacín al vapor","Pasta alla Norcina":"Pasta a la Norcina","Pasta al pesto di pistacchio":"Pasta con pesto de pistacho","Risotto al Barolo":"Risotto al Barolo","Involtini di melanzane alla parmigiana":"Rollitos de berenjena a la parmesana","Trippa alla romana":"Callos a la romana","Baccalà alla livornese":"Bacalao a la livornesa","Coniglio alla ligure":"Conejo a la ligur","Fagiolini al pomodoro":"Judías verdes con tomate","Bonet piemontese":"Bonet piamontés"});Object.assign(STEP_ES,{"Metti i pomodori a pezzi in caraffa e dai 2-3 colpi di Turbo: devono restare a pezzetti, non diventare passata.":"Pon los tomates en trozos en el vaso y da 2-3 golpes de Turbo: deben quedar en trocitos, no convertirse en triturado.","Unisci l’aglio tritato finissimo, il basilico spezzato a mano, l’olio e il sale e mescola a freddo.":"Añade el ajo picado muy fino, la albahaca troceada a mano, el aceite y la sal y mezcla en frío.","Lascia riposare 10 minuti e servi sul pane tostato (fuori dal robot).":"Deja reposar 10 minutos y sirve sobre el pan tostado (fuera del robot).","Aggiungi i carciofi bagnati di limone, la patata a cubi, il brodo e il sale.":"Añade las alcachofas rociadas con limón, la patata en dados, el caldo y la sal.","Affetta le zucchine e falle appassire con l’olio.":"Corta el calabacín en rodajas y póchalo con el aceite.","Sbatti le uova con parmigiano, sale e pepe fuori dal robot, unisci le zucchine intiepidite e versa in uno stampo imburrato.":"Bate los huevos con el parmesano, la sal y la pimienta fuera del robot, añade el calabacín templado y vierte en un molde untado con mantequilla.","Versa l’acqua in caraffa, metti lo stampo nella vaporiera e cuoci.":"Vierte el agua en el vaso, pon el molde en la vaporera y cocina.","Versa la panna, il sale e il pepe e lega la salsa.":"Vierte la nata, la sal y la pimienta y liga la salsa.","Manteca la pasta cotta a parte con il parmigiano.":"Liga la pasta cocida aparte con el parmesano.","Trita i pistacchi nella caraffa fredda e asciutta.":"Tritura los pistachos en el vaso frío y seco.","Aggiungi i formaggi e il sale.":"Añade los quesos y la sal.","Versa l’olio a filo dal foro con le lame in movimento.":"Vierte el aceite en hilo por el orificio con las cuchillas en marcha.","Manteca con la pasta e un cucchiaio di acqua di cottura, a macchina spenta.":"Liga con la pasta y una cucharada de agua de cocción, con la máquina apagada.","Unisci metà del burro e fai appassire senza colorire.":"Añade la mitad de la mantequilla y pocha sin que tome color.","Aggiungi il riso e tostalo.":"Añade el arroz y tuéstalo.","Versa il Barolo senza dosatore e lascialo assorbire.":"Vierte el Barolo sin cubilete y deja que se absorba.","Manteca a macchina spenta con il burro restante e il parmigiano.":"Liga con la máquina apagada con la mantequilla restante y el parmesano.","Griglia le melanzane a fette per il lungo, fuori dal robot: devono restare asciutte.":"Asa a la plancha las berenjenas en láminas a lo largo, fuera del robot: deben quedar secas.","Unisci l’olio e soffriggi, poi versa la passata, il basilico e il sale e cuoci il sugo.":"Añade el aceite y sofríe, luego vierte el tomate triturado, la albahaca y la sal y cocina la salsa.","Farcisci le fette con mozzarella e parmigiano, arrotolale e disponile in pirofila con il sugo.":"Rellena las láminas con mozzarella y parmesano, enróllalas y colócalas en una fuente con la salsa.","Copri di parmigiano e gratina in forno.":"Cubre con parmesano y gratina en el horno.","Aggiungi la trippa a listarelle e rosolala.":"Añade los callos en tiras y sofríelos.","Unisci i pelati, il sale e il pepe e cuoci piano con il cestello capovolto sul coperchio.":"Añade los tomates pelados, la sal y la pimienta y cocina suave con el cestillo del revés sobre la tapa.","Mentuccia e pecorino a macchina spenta.":"Menta poleo y pecorino con la máquina apagada.","Infarina i pezzi di baccalà, fuori dal robot.":"Enharina los trozos de bacalao, fuera del robot.","Unisci l’olio e soffriggi dolcemente.":"Añade el aceite y sofríe suavemente.","Versa i pelati e il sale e fai restringere.":"Vierte los tomates pelados y la sal y deja reducir.","Adagia il baccalà e cuoci senza mescolare: scuoti la caraffa a metà cottura.":"Coloca el bacalao y cocina sin remover: agita el vaso a media cocción.","Trita l’aglio e soffriggilo con l’olio.":"Tritura el ajo y sofríelo con el aceite.","Aggiungi il coniglio e rosolalo a coperchio aperto, girandolo a mano.":"Añade el conejo y dóralo con la tapa abierta, dándole la vuelta a mano.","Unisci olive, pinoli, rosmarino, brodo e sale e cuoci piano.":"Añade las aceitunas, los piñones, el romero, el caldo y la sal y cocina suave.","Trita la cipolla e falla appassire con l’olio.":"Tritura la cebolla y póchala con el aceite.","Unisci i fagiolini, i pelati e il sale e cuoci con il cestello capovolto sul coperchio.":"Añade las judías verdes, los tomates pelados y la sal y cocina con el cestillo del revés sobre la tapa.","Basilico a crudo a fine cottura.":"Albahaca en crudo al final de la cocción.","Prepara il caramello in caraffa e versalo subito nello stampo, girandolo per rivestire il fondo.":"Prepara el caramelo en el vaso y viértelo enseguida en el molde, girándolo para cubrir el fondo.","Trita gli amaretti.":"Tritura los amaretti.","Unisci latte, uova, zucchero, cacao e rum e mescola.":"Añade la leche, los huevos, el azúcar, el cacao y el ron y mezcla.","Versa nello stampo caramellato e cuoci in forno a bagnomaria.":"Vierte en el molde caramelizado y cocina en el horno al baño maría.","Lascia in frigo almeno 4 ore prima di sformare.":"Deja en la nevera al menos 4 horas antes de desmoldar."});Object.assign(NOTE_ES,{"Un colpo di Turbo di troppo e il pomodoro diventa passata: conta i colpi e fermati appena vedi i pezzetti.":"Un golpe de Turbo de más y el tomate se convierte en triturado: cuenta los golpes y para en cuanto veas los trocitos.","Qui il campo gradi resta spento: è tutto a crudo, il riposo serve a far uscire il sugo dei pomodori.":"Aquí el campo de grados queda apagado: es todo en crudo, el reposo sirve para que los tomates suelten su jugo.","Bagna i carciofi nel limone appena tagliati: anneriscono prima ancora di arrivare in caraffa.":"Rocía las alcachofas con limón nada más cortarlas: se ennegrecen antes incluso de llegar al vaso.","Frulla con il cestello appoggiato sul coperchio al posto del dosatore: il vapore in pressione fa saltare il coperchio.":"Tritura con el cestillo apoyado sobre la tapa en lugar del cubilete: el vapor a presión hace saltar la tapa.","In caraffa la frittata uscirebbe frammentata: lo stampo nella vaporiera è il modo giusto per averla a fetta.":"En el vaso la tortilla saldría deshecha: el molde en la vaporera es la forma correcta de que quede entera para cortar.","Fai intiepidire le zucchine prima di unirle alle uova, altrimenti le cuociono subito.":"Deja templar el calabacín antes de añadirlo a los huevos, de lo contrario los cuaja al momento.","La panna va sempre a potenza bassa: sopra i 95°C si separa e la salsa diventa unta.":"La nata va siempre a potencia baja: por encima de 95 °C se corta y la salsa queda grasienta.","La salsiccia rilascia molto grasso: se la vuoi più leggera scendi a 10 ml di olio.":"La salchicha suelta mucha grasa: si la quieres más ligera baja a 10 ml de aceite.","Mai la temperatura: il pesto si fa a crudo, il calore fa annerire i pistacchi e impazzire i formaggi.":"Nunca temperatura: el pesto se hace en crudo, el calor ennegrece los pistachos y corta los quesos.","Caraffa fredda: mettila in freezer 10 minuti prima, le lame del Mambo scaldano più di quelle del Bimby.":"Vaso frío: métalo en el congelador 10 minutos antes, las cuchillas del Mambo calientan más que las del Bimby.","Qui il vino non è una sfumata di due minuti ma l’intera fase liquida iniziale: è lui a dare colore e struttura al chicco.":"Aquí el vino no es un desglasado de dos minutos sino toda la fase líquida inicial: es él quien da color y estructura al grano.","Grigliare le melanzane fuori è l’unico modo per averle asciutte: in caraffa rilascerebbero troppa acqua e l’involtino non terrebbe.":"Asarlas a la plancha fuera es la única forma de que las berenjenas queden secas: en el vaso soltarían demasiada agua y el rollito no aguantaría.","La trippa si compra già lessata: qui serve solo insaporirla a lungo e piano.":"Los callos se compran ya cocidos: aquí solo hay que darles sabor, largo y suave.","Potenza 4 e non di più: sopra, il sugo sobbolle troppo forte e la trippa si asciuga invece di intenerirsi.":"Potencia 4 y no más: por encima, la salsa hierve demasiado fuerte y los callos se secan en lugar de ablandarse.","Velocità 0 e nessuna pala contro il pesce: il baccalà si sfalda al primo giro di lame.":"Velocidad 0 y ninguna pala contra el pescado: el bacalao se deshace al primer giro de cuchillas.","Il baccalà è già sapido: assaggia il sugo prima di aggiungere altro sale.":"El bacalao ya es sabroso de por sí: prueba la salsa antes de añadir más sal.","La versione ligure è in bianco: niente pomodoro, il sapore lo danno le olive taggiasche e i pinoli.":"La versión ligur es en blanco: nada de tomate, el sabor lo dan las aceitunas taggiasche y los piñones.","Velocità 0: il coniglio ha ossa piccole e a velocità 1 si spolpa attaccandosi alle pale.":"Velocidad 0: el conejo tiene huesos pequeños y a velocidad 1 se deshuesa y se pega a las palas.","Velocità 1 con il MamboMix: le lame spezzerebbero i fagiolini in pochi secondi.":"Velocidad 1 con el MamboMix: las cuchillas romperían las judías verdes en pocos segundos.","Il Mambo si ferma a 120°C: il caramello ci mette qualche minuto in più del Bimby e va sorvegliato a vista, perché passa da ambrato a bruciato in pochi secondi.":"El Mambo se queda en 120 °C: el caramelo tarda unos minutos más que en el Bimby y hay que vigilarlo sin perderlo de vista, porque pasa de ámbar a quemado en pocos segundos.","Caraffa Habana obbligatoria: latte, uova e zucchero sull’acciaio si attaccano al primo grado di troppo.":"Vaso Habana obligatorio: la leche, los huevos y el azúcar se pegan al acero al primer grado de más.","Il bagnomaria in forno non è facoltativo: a calore secco il bonet si crepa e diventa gommoso.":"El baño maría en el horno no es opcional: con calor seco el bonet se agrieta y queda gomoso."});

  for(const r of RICETTE){ if(!r||r.mia||r.com) continue;
    if(!r._ingIt) r._ingIt=(r.ing||[]).map(i=>i.n).join(' ');

    for(const i of (r.ing||[])){ if(ING_ES[i.n])i.n=ING_ES[i.n]; if(UNIT_ES[i.u])i.u=UNIT_ES[i.u]; }
    for(const s of (r.steps||[])){ if(s.x&&STEP_ES[s.x])s.x=STEP_ES[s.x]; }

  }
}

let HOST=null;
const conTimeout=(p,ms)=>Promise.race([Promise.resolve(p),new Promise(r=>setTimeout(()=>r(undefined),ms))]);
async function probeHost(){
  if(!(window.storage&&window.storage.get))return null;
  try{ const ok=await conTimeout(Promise.resolve(window.storage.get('__probe__')).then(()=>true),300);
    return ok?window.storage:null; }catch(e){ return null; }
}
async function load(k,d){
  try{ const r=localStorage.getItem(k); if(r!==null)return JSON.parse(r); }catch(e){}
  try{ if(HOST){const r=await conTimeout(HOST.get(k),200);if(r)return JSON.parse(r.value);} }catch(e){}
  return (k in mem)?mem[k]:d;
}
async function save(k,v){
  mem[k]=v;
  try{ if(HOST)HOST.set(k,JSON.stringify(v)); }catch(e){}
  try{ if(v===null)localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch(e){}
}

function imgToDataURL(file,cb){
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image(); im.onload=()=>{
    const max=1100,sc=Math.min(1,max/Math.max(im.width,im.height));
    const cv=document.createElement('canvas'); cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
    cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
    cb(cv.toDataURL('image/jpeg',.74));
  }; im.onerror=()=>cb(null); im.src=fr.result; };
  fr.readAsDataURL(file);
}
function setFoto(target,src){
  if(!src){ delFoto(target); return; }
  if(target.tipo==='ric'){
    S.foto[target.id]=src; save('mambo:foto:'+target.id,src);
    load('mambo:fotoidx',[]).then(ix=>{ if(!ix.includes(target.id)){ix.push(target.id);save('mambo:fotoidx',ix);} });
  } else if(target.tipo==='acc'){
    S.accfoto[target.id]=src; save('mambo:accfoto:'+target.id,src);
    load('mambo:accfotoidx',[]).then(ix=>{ if(!ix.includes(target.id)){ix.push(target.id);save('mambo:accfotoidx',ix);} });
  } else {
    const k=stepKey(target.id,target.i);
    S.stepfoto[k]=src; save('mambo:stepfoto:'+k,src);
    load('mambo:stepidx',[]).then(ix=>{ if(!ix.includes(k)){ix.push(k);save('mambo:stepidx',ix);} });
  }
}
function delFoto(target){
  if(target.tipo==='ric'){
    delete S.foto[target.id]; save('mambo:foto:'+target.id,null);
    load('mambo:fotoidx',[]).then(ix=>save('mambo:fotoidx',ix.filter(x=>x!==target.id)));
  } else if(target.tipo==='acc'){
    delete S.accfoto[target.id]; save('mambo:accfoto:'+target.id,null);
    load('mambo:accfotoidx',[]).then(ix=>save('mambo:accfotoidx',ix.filter(x=>x!==target.id)));
  } else {
    const k=stepKey(target.id,target.i);
    delete S.stepfoto[k]; save('mambo:stepfoto:'+k,null);
    load('mambo:stepidx',[]).then(ix=>save('mambo:stepidx',ix.filter(x=>x!==k)));

/* ============================================================
   DOSI PER PASSAGGIO
   Assegna ogni ingrediente al primo passaggio che lo nomina,
   così ogni step mostra "cosa inserire e quanto" (scalato).
   Match sulla parola principale (prima parola), con fallback
   alle altre parole; radici di 6 caratteri per gestire
   singolare/plurale (zucchina/zucchine).
   ============================================================ */
function radice(w){ return w.slice(0,Math.min(6,w.length)); }
function combacia(tok,w){ const a=radice(w),b=radice(tok); return (a.length>=3&&tok.startsWith(a))||(b.length>=3&&w.startsWith(b)); }
// sinonimi: quando il passaggio usa una parola generica al posto del nome
const ALIAS=[
 [/macinat|manzo|maiale|salsicc|vitello|guancial|pancett|polpa/,'carne'],
 [/spaghett|penne|bucatin|maccheron|linguin|fusill|rigaton|tagliatell|pasta mista|pasta corta/,'pasta'],
 [/tuorl|albumi/,'uova'],
];
function assegnaIng(r){
  const perStep=r.steps.map(()=>[]);
  const toks=r.steps.map(s=>norm(s.x).split(/\s+/).filter(Boolean));
  r.ing.forEach(i=>{
    const nn=norm(i.n);
    const words=nn.split(/\s+/).filter(w=>w.length>=3);
    if(!words.length)return;
    const alias=ALIAS.filter(([re])=>re.test(nn)).map(([,a])=>a);
    const cand=[words[0],...words.slice(1).sort((a,b)=>b.length-a.length),...alias];
    let placed=false;
    for(const w of cand){ if(placed)break;
      for(let si=0; si<toks.length; si++){
        if(toks[si].some(t=>combacia(t,w))){ perStep[si].push(i); placed=true; break; } } }
  });
  return perStep;
}
function dosiHTML(list,r){
  if(!list||!list.length)return '';
  return `<div class="steplead">Aggiungi ora</div><div class="stepadd">${list.map(i=>
    `<span class="ai"><b>${fmtQ(scala(i,r.porz,S.porz))} ${esc(i.u)}</b><span>${esc(i.n)}</span></span>`).join('')}</div>`;
}

/* ---------- DETTAGLIO ---------- */
/* Passaggi "fuori dal robot": rilevati dal testo (a parte, in padella, friggi, lessa, in forno...).
   Una ricetta puo' anche dichiararli a mano con r.fuori:['...']. */
const RE_FUORI=/\b(a parte|separatamente|in padella|in forno|in una pentola|frigg\w*|grigli\w+|sul fuoco|fuori dal robot)\b/i;
const RE_LESS=/\bless\w+\b/i;
function isFuori(s){
  if(!s||!s.x) return false; const x=s.x;
  const inCaraffa=/\b(in|nella)\s+caraffa\b/i.test(x);
  if(RE_LESS.test(x) && !inCaraffa) return true;              /* lessare fuori dal robot */
  if(RE_FUORI.test(x)){
    if(/\bserv\w*/i.test(x) && !/frigg|forno|padella|pentola|less|sul fuoco/i.test(x)) return false; /* "a parte" da servizio, non preparazione */
    return true;
  }
  return false;
}
function fuoriDi(r){
  if(Array.isArray(r.fuori)&&r.fuori.length) return r.fuori.slice();
  return (r.steps||[]).filter(isFuori).map(s=>s.x);

    const nm=_wrap(cx,i.n,colW-qw-12,1)[0]||'';
    cx.fillText(nm,x+qw+10,yy); });
  const rows=Math.ceil(shown.length/2);
  y+=rows*36+6;
  if(ing.length>shown.length){ cx.fillStyle='#B39B87'; cx.font='400 21px '+SANS;
    cx.fillText('+ '+(ing.length-shown.length)+' '+L('altri ingredienti','ingredientes más'),P,y); y+=32; }

  /* geometria footer (serve per sapere quanto spazio resta) */
  const qs=176, qx=W-P-qs, qy=H-P-qs, yLimit=qy-34;

  /* ti serve */
  y+=14;
  const accs=[(r.caraffa==='Habana'?L('Caraffa Habana','Vaso Habana'):L('Caraffa acciaio','Vaso de acero'))].concat((r.acc||[]).map(a=>esT(a)));
  cx.font='500 21px '+SANS; let ax=P;
  for(const a of accs){ const tw=cx.measureText(a).width, cwd=tw+34;
    if(ax+cwd>W-P) break;
    cx.fillStyle='rgba(196,107,255,.16)'; _rr(cx,ax,y-24,cwd,38,19); cx.fill();
    cx.strokeStyle='rgba(196,107,255,.38)'; cx.lineWidth=2; _rr(cx,ax,y-24,cwd,38,19); cx.stroke();
    cx.fillStyle='#D9B8F5'; cx.fillText(a,ax+17,y+2); ax+=cwd+12; }

  /* procedimento: riempie lo spazio con i passaggi che ci stanno */
  y+=72;
  cx.fillStyle='#FFF3E4'; cx.font='600 29px '+SANS;
  cx.fillText(L('Come si fa','Cómo se hace'),P,y); y+=38;
  const allSteps=r.steps.filter(s=>s.x); let nShown=0;
  for(let k=0;k<allSteps.length;k++){
    const s=allSteps[k], parts=[];
    if(s.t&&s.t!=='—')parts.push(s.t);
    if(s.v&&s.v!=='—')parts.push('vel '+s.v);
    if(s.T&&s.T!=='—')parts.push(s.T);
    if(s.P&&s.P!=='—')parts.push('P'+s.P);
    cx.font='400 21px '+SANS;
    const lines=_wrap(cx,(k+1)+'. '+s.x,W-2*P,2);
    const need=lines.length*28+(parts.length?24:0)+10;
    if(y+need>yLimit) break;
    cx.fillStyle='#E7D6C4';
    for(const ln of lines){ cx.fillText(ln,P,y); y+=28; }
    if(parts.length){ cx.fillStyle='#FFB424'; cx.font='600 19px '+SANS;
      cx.fillText(parts.join(' · '),P+24,y+1); y+=24; }
    y+=10; nShown++;
  }
  if(nShown<allSteps.length){ const rest=allSteps.length-nShown;
    cx.fillStyle='#B39B87'; cx.font='400 21px '+SANS;
    cx.fillText('+ '+rest+' '+(rest===1?L('passaggio nell’app','paso en la app'):L('passaggi nell’app','pasos en la app')),P,y+2); }

  /* footer: QR + url */
  cx.fillStyle='#FFF3E4'; _rr(cx,qx,qy,qs,qs,24); cx.fill();
  if(typeof CARD_QR==='string'&&CARD_QR){
    const mod=33, inner=qs-30, sc=inner/(mod+4);
    cx.save(); cx.translate(qx+15+2*sc, qy+15+2*sc); cx.scale(sc,sc);
    cx.fillStyle='#120D0B'; try{ cx.fill(new Path2D(CARD_QR)); }catch(e){} cx.restore(); }
  cx.fillStyle='#FFF3E4'; cx.font='600 27px '+SANS;
  cx.fillText(L('Inquadra e cucina','Escanea y cocina'),P,qy+70);
  cx.fillStyle='#B39B87'; cx.font='400 22px '+SANS;
  const ul=_wrap(cx,CARD_URL,W-2*P-qs-40,2);
  let uy=qy+108; for(const ln of ul){ cx.fillText(ln,P,uy); uy+=30; }
  cx.fillStyle='#7A6558'; cx.font='400 19px '+SANS;
  cx.fillText(L('174 ricette · gratis · offline','174 recetas · gratis · sin conexión').replace('174',String(RICETTE.length)),P,uy+8);

  return new Promise(res=>cv.toBlob(res,'image/png'));
}

async function condividiRicetta(r){

    const file=new File([blob],'mamboconvert-'+r.id+'.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:r.nome,text:txt}); return; }
      catch(e){ if(e&&e.name==='AbortError') return; }
    }
    try{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob);

  const fb=async()=>{ try{ await navigator.clipboard.writeText(txt); return true; }
    catch(e){ const ta=document.createElement('textarea'); ta.value=txt; ta.style.cssText='position:fixed;opacity:0';

}

function saySan(t){ return String(t||'')
  .replace(/\u00b0C/g,' gradi').replace(/\u00b0/g,' gradi')
  .replace(/\bsec\b/gi,'secondi').replace(/\bmin\b/gi,'minuti')
  .replace(/\bvel\b/gi,'velocit\u00e0').replace(/\u00b7/g,' ').replace(/\s+/g,' ').trim(); }
function itVoices(){ try{ return (speechSynthesis.getVoices()||[]).filter(v=>/^it([-_]|$)/i.test(v.lang)); }catch(e){ return []; } }
function pickVoice(){ try{ const vs=(speechSynthesis.getVoices()||[]);
  if(voiceURI){ const c=vs.find(v=>v.voiceURI===voiceURI); if(c){ itVoice=c; return; } }
  const it=itVoices();
  const score=v=>{ const n=(v.name||'').toLowerCase(); let sc=0;
    if(/enhanced|premium|natural|migliorat|neural|siri|eloquence/.test(n))sc+=4;
    if(/compact/.test(n))sc-=2; if(v.localService)sc+=1; return sc; };
  it.sort((a,b)=>score(b)-score(a));
  itVoice=it[0]||vs.find(v=>/it/i.test(v.lang))||null; }catch(e){} }
function speak(text){ try{ if(!('speechSynthesis' in window)||!text)return; speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang='it-IT'; if(itVoice)u.voice=itVoice; u.rate=0.98; u.pitch=1; speechSynthesis.speak(u);
 }catch(e){} }
function stopSpeak(){ try{ if('speechSynthesis' in window)speechSynthesis.cancel(); }catch(e){} }
